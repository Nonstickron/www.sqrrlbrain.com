<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crucible — Formulary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #131209;
      --surface:    #1c1912;
      --surface-hi: #242018;
      --border:     #302b1e;
      --border-hi:  #4a4333;
      --gold:       #c4993a;
      --gold-dim:   #7a5f22;
      --gold-bg:    #1e1a0e;
      --text:       #e6dcc4;
      --text-dim:   #7a7060;
      --text-mid:   #b8a888;
      --green:      #6ba87a;
      --green-bg:   #0e1a10;
      --red:        #b87560;
      --red-bg:     #1a0e0a;
      --teal:       #6aabaa;
      --teal-bg:    #0e1a1a;
      --heat:       #c47a4a;
      --heat-bg:    #1e1208;
      --accent:     #c8421a;
      --serif:      'Lora', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Topbar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px 14px; border-bottom: 1px solid var(--border);
      background: var(--surface); position: sticky; top: 0; z-index: 50;
    }
    .brand { font-family: 'Lora', serif; font-size: 1.5rem; font-weight: 500; color: var(--gold); line-height: 1; }
    .brand-sub { font-family: 'DM Mono', monospace; font-size: 0.62rem; font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); margin-top: 3px; }

    .pantry-btn {
      display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 6px;
      border: 1px solid var(--border-hi); background: transparent;
      font-family: 'DM Sans', sans-serif; font-size: 0.78rem; color: var(--text-mid); cursor: pointer; transition: all 0.15s;
    }
    .pantry-btn:hover { background: var(--surface-hi); color: var(--text); border-color: var(--gold-dim); }
    .pantry-badge { background: var(--gold-bg); color: var(--gold); border-radius: 12px; padding: 1px 7px; font-family: 'DM Mono', monospace; font-size: 0.7rem; }

    /* ── Controls ── */
    .controls { padding: 18px 28px 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .search-wrap { position: relative; margin-bottom: 12px; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 0.9rem; pointer-events: none; }
    .search-input {
      width: 100%; max-width: 560px; background: var(--surface-hi); border: 1px solid var(--border-hi);
      color: var(--text); border-radius: 8px; padding: 10px 14px 10px 38px;
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem; transition: border-color 0.15s;
    }
    .search-input:focus { outline: none; border-color: var(--gold-dim); }
    .search-input::placeholder { color: var(--text-dim); }

    .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .cat-pills { display: flex; gap: 5px; flex-wrap: wrap; }
    .lib-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; padding: 4px 0; border-bottom: 1px solid var(--border); }
    .lib-pill {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: transparent;
      color: var(--text-mid);
      border: 1px solid var(--border);
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .lib-pill:hover { color: var(--text); border-color: var(--text-mid); }
    .lib-pill.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }
    .lib-pill .lib-count { font-size: 11px; opacity: 0.7; margin-left: 4px; font-weight: 500; }
    .cat-pill {
      padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 500;
      border: 1px solid var(--border-hi); background: transparent;
      color: var(--text-dim); cursor: pointer; transition: all 0.12s; font-family: 'DM Sans', sans-serif;
    }
    .cat-pill:hover { color: var(--text-mid); }
    .cat-pill.active { background: var(--gold-bg); color: var(--gold); border-color: var(--gold-dim); }
    .filter-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
    .toggle-label { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-dim); cursor: pointer; user-select: none; white-space: nowrap; }
    .toggle-label input { accent-color: var(--gold); cursor: pointer; }
    .result-info { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--text-dim); margin-left: auto; white-space: nowrap; }
    .flag-pill { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--gold); white-space: nowrap; }

    /* ── Recipe list ── */
    .recipe-list { max-width: 860px; margin: 0 auto; padding: 20px 28px 60px; }

    .recipe-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.12s; }
    .recipe-card:hover { border-color: var(--border-hi); }
    .recipe-card.flagged-card { border-color: var(--gold-dim); background: var(--gold-bg); }

    .recipe-header { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; user-select: none; }
    .recipe-header:hover { background: var(--surface-hi); }
    .recipe-card.flagged-card .recipe-header:hover { background: #201c0f; }

    .match-badge { font-family: 'DM Mono', monospace; font-size: 0.65rem; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; min-width: 38px; text-align: center; }
    .match-100  { background: var(--green-bg); color: var(--green); }
    .match-high { background: #1a1a0a; color: #c4c44a; }
    .match-mid  { background: #1a140a; color: var(--heat); }
    .match-low  { background: var(--red-bg); color: var(--red); }

    .recipe-name { font-family: 'Lora', serif; font-size: 1rem; font-weight: 500; color: var(--text); flex: 1; line-height: 1.3; }
    .heat-tag { font-size: 0.65rem; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; font-family: 'DM Mono', monospace; }
    .heat-yes { background: var(--heat-bg); color: var(--heat); }
    .heat-no  { background: var(--green-bg); color: var(--green); }

    .flag-btn { background: none; border: none; cursor: pointer; font-size: 0.9rem; padding: 2px 4px; flex-shrink: 0; opacity: 0.25; transition: opacity 0.15s; line-height: 1; color: var(--gold); }
    .flag-btn:hover { opacity: 0.7; }
    .flag-btn.flagged { opacity: 1; }
    .chevron { color: var(--text-dim); font-size: 0.65rem; flex-shrink: 0; transition: transform 0.18s; }
    .recipe-card.open .chevron { transform: rotate(90deg); }

    .recipe-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
    .recipe-card.open .recipe-body { display: block; }
    .recipe-desc { font-family: 'Lora', serif; font-size: 0.95rem; color: var(--text-dim); margin: 10px 0 12px; line-height: 1.6; font-style: italic; }

    .ing-table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
    .ing-table th { text-align: left; color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 0.6rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-bottom: 1px solid var(--border); }
    .ing-table td { padding: 5px 8px; border-bottom: 1px solid #1e1b12; font-size: 0.82rem; vertical-align: middle; }
    .ing-table tr:last-child td { border-bottom: none; }

    .ing-have    { color: var(--green); }
    .ing-missing { color: var(--red); }
    .ing-swap    { color: var(--teal); }

    .swap-inline-btn {
      font-size: 0.65rem; padding: 1px 6px; border-radius: 3px; margin-left: 6px;
      border: 1px solid var(--teal-bg); background: var(--teal-bg); color: var(--teal);
      cursor: pointer; font-family: 'DM Mono', monospace; transition: all 0.1s;
      vertical-align: middle;
    }
    .swap-inline-btn:hover { border-color: var(--teal); }

    .swap-inline-select {
      margin-left: 6px; font-size: 0.72rem; background: var(--surface-hi);
      border: 1px solid var(--teal); color: var(--teal); border-radius: 3px;
      padding: 1px 4px; font-family: 'DM Sans', sans-serif;
    }
    .swap-inline-select:focus { outline: none; }

    .pct-cell { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--text-dim); }
    .pct-input { width: 58px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 2px 6px; font-family: 'DM Mono', monospace; font-size: 0.78rem; }
    .pct-input:focus { outline: none; border-color: var(--gold-dim); }
    .pct-total { font-family: 'DM Mono', monospace; font-size: 0.7rem; margin: 4px 0 12px; padding-left: 8px; }
    .batch-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .batch-label { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--text-dim); letter-spacing: 0.08em; white-space: nowrap; }
    .batch-input { width: 72px; background: var(--bg); border: 1px solid var(--border-hi); color: var(--text); border-radius: 4px; padding: 3px 7px; font-family: 'DM Mono', monospace; font-size: 0.78rem; }
    .batch-input:focus { outline: none; border-color: var(--gold-dim); }
    .g-cell { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--text-dim); padding: 5px 8px; white-space: nowrap; }
    .pct-ok   { color: var(--green); }
    .pct-warn { color: var(--red); }

    .source-notes { font-size: 0.75rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 12px; padding: 8px 10px; background: var(--surface-hi); border-radius: 5px; border-left: 2px solid var(--border-hi); }
    .process-toggle { background: none; border: none; font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); cursor: pointer; padding: 8px 0 4px; display: flex; align-items: center; gap: 5px; }
    .process-toggle:hover { color: var(--text-mid); }
    .process-toggle .ptoggle-arrow { font-size: 0.5rem; transition: transform 0.15s; }
    .process-toggle.open .ptoggle-arrow { transform: rotate(90deg); }
    .process-body { display: none; font-size: 0.78rem; color: var(--text-mid); line-height: 1.7; margin-bottom: 12px; padding: 8px 10px; background: var(--surface-hi); border-radius: 5px; border-left: 2px solid var(--heat-bg); white-space: pre-wrap; }
    .process-body.open { display: block; }
    .notes-label { font-family: 'DM Mono', monospace; font-size: 0.6rem; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin: 12px 0 5px; display: block; }
    .user-notes { width: 100%; min-height: 52px; background: var(--bg); border: 1px solid var(--border); color: var(--text-mid); border-radius: 5px; padding: 8px 10px; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; line-height: 1.5; resize: vertical; margin-bottom: 12px; }
    .user-notes:focus { outline: none; border-color: var(--gold-dim); }
    .user-notes::placeholder { color: var(--text-dim); }
    .user-notes.has-notes { border-color: var(--gold-dim); }

    .card-actions { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .btn { font-family: 'DM Sans', sans-serif; font-size: 0.72rem; padding: 4px 12px; border-radius: 5px; border: 1px solid var(--border-hi); background: transparent; color: var(--text-dim); cursor: pointer; transition: all 0.12s; }
    .btn:hover { background: var(--surface-hi); color: var(--text); }
    .btn-gold { border-color: var(--gold-dim); color: var(--gold); }
    .btn-gold:hover { background: var(--gold-bg); }
    .src-link { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--text-dim); text-decoration: none; margin-left: auto; }
    .src-link:hover { color: var(--text-mid); }
    .shop-panel { margin-top: 10px; margin-bottom: 4px; }
    .shop-panel-header { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 7px; }
    .shop-row { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
    .shop-row:last-child { border-bottom: none; }
    .shop-ing { flex: 1; color: var(--text-mid); }
    .shop-links { display: flex; gap: 6px; flex-shrink: 0; }
    .shop-link { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--gold); text-decoration: none; padding: 1px 6px; border: 1px solid var(--gold-dim); border-radius: 3px; background: var(--gold-bg); white-space: nowrap; }
    .shop-link:hover { background: #272010; }

    .load-more { display: block; width: 100%; margin-top: 4px; padding: 12px; border-radius: 7px; border: 1px dashed var(--border-hi); background: transparent; font-family: 'Lora', serif; font-size: 0.95rem; color: var(--text-dim); cursor: pointer; transition: all 0.15s; }
    .load-more:hover { color: var(--text-mid); border-color: var(--gold-dim); }
    .empty-state { text-align: center; padding: 60px 0; font-family: 'Lora', serif; font-size: 1.1rem; font-style: italic; color: var(--text-dim); }

    /* ── Drawer ── */
    .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; }
    .drawer-overlay.open { display: block; }
    .drawer { position: fixed; top: 0; left: -400px; bottom: 0; width: 380px; background: var(--surface); border-right: 1px solid var(--border-hi); z-index: 101; transition: left 0.22s ease; display: flex; flex-direction: column; overflow: hidden; }
    .drawer.open { left: 0; }

    .drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0; flex-shrink: 0; }
    .drawer-title { font-family: 'Lora', serif; font-size: 1.15rem; font-weight: 500; color: var(--gold); }
    .drawer-close { background: none; border: none; color: var(--text-dim); font-size: 1.1rem; cursor: pointer; padding: 4px 6px; }
    .drawer-close:hover { color: var(--text); }

    /* Tabs */
    .drawer-tabs { display: flex; gap: 0; padding: 14px 20px 0; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .drawer-tab { flex: 1; padding: 8px 0; background: none; border: none; border-bottom: 2px solid transparent; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; color: var(--text-dim); cursor: pointer; transition: all 0.15s; margin-bottom: -1px; }
    .drawer-tab:hover { color: var(--text-mid); }
    .drawer-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    .drawer-pane { display: none; overflow-y: auto; padding: 16px 20px 24px; flex: 1; }
    .drawer-pane.active { display: block; }

    /* Pantry search */
    .pantry-search-wrap { position: relative; margin-bottom: 14px; }
    .pantry-search {
      width: 100%; background: var(--surface-hi); border: 1px solid var(--border-hi);
      color: var(--text); border-radius: 7px; padding: 9px 12px;
      font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
    }
    .pantry-search:focus { outline: none; border-color: var(--gold-dim); }
    .pantry-search::placeholder { color: var(--text-dim); }

    .pantry-suggest {
      display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 10;
      background: var(--surface-top, #2a2519); border: 1px solid var(--border-hi);
      border-radius: 0 0 7px 7px; list-style: none; max-height: 200px; overflow-y: auto;
    }
    .pantry-suggest.show { display: block; }
    .pantry-suggest li { padding: 8px 12px; font-size: 0.82rem; cursor: pointer; color: var(--text-mid); }
    .pantry-suggest li:hover { background: var(--surface-hi); color: var(--text); }

    /* Chips */
    .pantry-count { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--text-dim); margin-bottom: 10px; letter-spacing: 0.06em; }
    .pantry-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: flex; align-items: center; gap: 5px; padding: 4px 10px;
      background: var(--green-bg); border: 1px solid #1e3a22; border-radius: 20px;
      font-size: 0.75rem; color: var(--green);
    }
    .chip-rm { background: none; border: none; color: #3a6040; cursor: pointer; font-size: 0.8rem; padding: 0; line-height: 1; }
    .chip-rm:hover { color: var(--green); }

    /* Recommendations */
    .rec-section { margin-top: 20px; }
    .rec-header { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
    .rec-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
    .rec-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--surface-hi); border-radius: 6px; border: 1px solid var(--border); }
    .rec-name { flex: 1; font-size: 0.82rem; color: var(--text-mid); }
    .rec-completes { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--green); white-space: nowrap; }
    .rec-helps { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--text-dim); white-space: nowrap; }

    /* Swaps pane */
    .swap-explainer { font-size: 0.78rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 14px; padding: 8px 10px; background: var(--surface-hi); border-radius: 5px; border-left: 2px solid var(--border-hi); }
    .swap-rules { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .swap-rule { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--surface-hi); border-radius: 5px; font-size: 0.8rem; }
    .swap-rule-from { color: var(--red); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .swap-rule-arr  { color: var(--text-dim); flex-shrink: 0; font-size: 0.7rem; }
    .swap-rule-to   { color: var(--teal); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .swap-rule-rm   { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.8rem; padding: 0 2px; flex-shrink: 0; }
    .swap-rule-rm:hover { color: var(--text); }

    .swap-add-form { display: flex; flex-direction: column; gap: 7px; }
    .swap-add-form label { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
    .swap-search-wrap { position: relative; }
    .swap-add-btn { width: 100%; padding: 7px; border-radius: 5px; border: 1px dashed var(--border-hi); background: transparent; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; color: var(--text-dim); cursor: pointer; transition: all 0.12s; }
    .swap-add-btn:hover { color: var(--text-mid); border-color: var(--gold-dim); }

    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--green-bg); color: var(--green); border: 1px solid var(--green); border-radius: 7px; padding: 10px 18px; font-size: 0.78rem; font-family: 'DM Mono', monospace; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 200; }
    .toast.show { opacity: 1; }

    /* New Recipe button */
    .new-recipe-btn {
      display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 6px;
      border: 1px solid var(--gold-dim); background: var(--gold-bg);
      font-family: 'DM Sans', sans-serif; font-size: 0.78rem; color: var(--gold); cursor: pointer; transition: all 0.15s;
    }
    .new-recipe-btn:hover { background: #272010; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: flex-start; justify-content: center; padding: 24px 16px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border-hi); border-radius: 10px; width: 100%; max-width: 520px; display: flex; flex-direction: column; margin: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 1px solid var(--border); }
    .modal-title { font-family: 'Lora', serif; font-size: 1.15rem; font-weight: 500; color: var(--gold); }
    .modal-close { background: none; border: none; color: var(--text-dim); font-size: 1.1rem; cursor: pointer; padding: 4px 6px; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
    .form-row { display: flex; gap: 10px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .form-label { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
    .form-input, .form-select, .form-textarea {
      background: var(--surface-hi); border: 1px solid var(--border-hi); color: var(--text);
      border-radius: 6px; padding: 8px 10px; font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--gold-dim); }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--text-dim); }
    .form-textarea { min-height: 60px; resize: vertical; }
    .form-check-row { display: flex; align-items: center; gap: 8px; }
    .form-check-row input { accent-color: var(--gold); width: 14px; height: 14px; cursor: pointer; }
    .form-check-row label { font-size: 0.8rem; color: var(--text-mid); cursor: pointer; }
    .ing-rows { display: flex; flex-direction: column; gap: 7px; }
    .ing-row { display: flex; gap: 7px; align-items: center; }
    .ing-row-name { flex: 1; background: var(--surface-hi); border: 1px solid var(--border-hi); color: var(--text); border-radius: 6px; padding: 6px 9px; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; }
    .ing-row-name:focus { outline: none; border-color: var(--gold-dim); }
    .ing-row-name::placeholder { color: var(--text-dim); }
    .ing-row-pct { width: 64px; background: var(--surface-hi); border: 1px solid var(--border-hi); color: var(--text); border-radius: 6px; padding: 6px 9px; font-family: 'DM Mono', monospace; font-size: 0.78rem; }
    .ing-row-pct:focus { outline: none; border-color: var(--gold-dim); }
    .ing-row-rm { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.9rem; padding: 0 4px; flex-shrink: 0; }
    .ing-row-rm:hover { color: var(--red); }
    .add-ing-btn { align-self: flex-start; padding: 5px 12px; border-radius: 5px; border: 1px dashed var(--border-hi); background: transparent; font-family: 'DM Sans', sans-serif; font-size: 0.75rem; color: var(--text-dim); cursor: pointer; transition: all 0.12s; margin-top: 2px; }
    .add-ing-btn:hover { color: var(--text-mid); border-color: var(--gold-dim); }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px 18px; border-top: 1px solid var(--border); }
    .modal-save-btn { padding: 8px 20px; border-radius: 6px; border: 1px solid var(--gold-dim); background: var(--gold-bg); font-family: 'DM Sans', sans-serif; font-size: 0.82rem; color: var(--gold); cursor: pointer; transition: all 0.12s; }
    .modal-save-btn:hover { background: #272010; }
    .modal-cancel-btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border-hi); background: transparent; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; color: var(--text-dim); cursor: pointer; transition: all 0.12s; }
    .modal-cancel-btn:hover { color: var(--text); background: var(--surface-hi); }
    .btn-danger { border-color: var(--red); color: var(--red); }
    .btn-danger:hover { background: var(--red-bg); }

    @media (max-width: 600px) {
      .topbar, .controls { padding-left: 16px; padding-right: 16px; }
      .recipe-list { padding: 14px 16px 40px; }
    }

    /* ── Print modal ── */
    .print-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .print-tab { flex: 1; padding: 7px 0; background: none; border: none; border-bottom: 2px solid transparent; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; color: var(--text-dim); cursor: pointer; margin-bottom: -1px; }
    .print-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .print-fields { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .print-field-row { display: flex; gap: 8px; }
    .print-preview { border: 1px solid var(--border-hi); border-radius: 6px; padding: 14px; background: #fff; color: #111; min-height: 100px; }
    .label-preview { font-family: 'Helvetica Neue', Arial, sans-serif; color: #111; }
    .label-brand { font-size: 9pt; letter-spacing: 0.15em; text-transform: uppercase; color: #555; margin-bottom: 4px; }
    .label-name { font-size: 13pt; font-weight: 700; margin-bottom: 6px; line-height: 1.2; }
    .label-ings-head { font-size: 7pt; text-transform: uppercase; letter-spacing: 0.1em; color: #555; margin-bottom: 2px; margin-top: 6px; }
    .label-ings { font-size: 7.5pt; line-height: 1.5; color: #333; }
    .label-footer { display: flex; justify-content: space-between; margin-top: 8px; font-size: 7pt; color: #555; border-top: 1px solid #ccc; padding-top: 5px; }
    .label-warning { font-size: 7pt; color: #666; margin-top: 4px; }
    .card-preview { font-family: 'Helvetica Neue', Arial, sans-serif; color: #111; }
    .card-title { font-size: 16pt; font-weight: 700; margin-bottom: 2px; }
    .card-sub { font-size: 8pt; color: #777; margin-bottom: 10px; }
    .card-ing-table { width: 100%; border-collapse: collapse; font-size: 8pt; margin-bottom: 8px; }
    .card-ing-table th { text-align: left; border-bottom: 1px solid #ccc; padding: 2px 6px; color: #555; font-weight: 600; font-size: 7pt; text-transform: uppercase; }
    .card-ing-table td { padding: 3px 6px; border-bottom: 1px solid #eee; }
    .card-process { font-size: 8pt; line-height: 1.6; color: #333; white-space: pre-wrap; margin-top: 8px; border-top: 1px solid #ccc; padding-top: 8px; }

    @media print {
      body > * { display: none !important; }
      #printArea { display: block !important; position: static !important; margin: 0 !important; padding: 0 !important; background: #fff !important; }
    }
    #printArea { display: none; }
  </style>
</head>
<body>

<header class="topbar">
  <div>
    <div class="brand">5 Daughters</div>
    <div class="brand-sub">Formulary</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="new-recipe-btn" id="newRecipeBtn">+ New Recipe</button>
    <button class="pantry-btn" id="openDrawerBtn">
      My Pantry
      <span class="pantry-badge" id="invBadge">—</span>
    </button>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" id="searchInput" type="text" placeholder="Search recipes…" autocomplete="off">
  </div>
  <div class="lib-pills" id="libPills"></div>
  <div class="filter-row">
    <div class="cat-pills" id="catPills"></div>
    <div class="filter-sep"></div>
    <label class="toggle-label"><input type="checkbox" id="noHeatOnly"> No heat</label>
    <label class="toggle-label"><input type="checkbox" id="flaggedOnly"> Flagged</label>
    <span class="result-info" id="resultInfo"></span>
    <span class="flag-pill" id="flagPill"></span>
  </div>
</div>

<div class="recipe-list" id="recipeList"></div>

<!-- Drawer -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title">My Pantry</span>
    <button class="drawer-close" id="closeDrawerBtn">✕</button>
  </div>
  <div class="drawer-tabs">
    <button class="drawer-tab active" data-tab="pantry">Ingredients</button>
    <button class="drawer-tab" data-tab="swaps">Swaps</button>
  </div>

  <!-- Pantry pane -->
  <div class="drawer-pane active" id="paneIngredients">
    <div class="pantry-search-wrap">
      <input class="pantry-search" id="pantrySearch" type="text" placeholder="Add an ingredient…" autocomplete="off">
      <ul class="pantry-suggest" id="pantrySuggest"></ul>
    </div>
    <div class="pantry-count" id="pantryCount"></div>
    <div class="pantry-chips" id="pantryChips"></div>
    <div class="rec-section" id="recSection"></div>
  </div>

  <!-- Swaps pane -->
  <div class="drawer-pane" id="paneSwaps">
    <p class="swap-explainer">When a recipe calls for something you don't have, a swap tells the tool to use a substitute you own instead — it counts toward match % and shows in the recipe.</p>
    <ul class="swap-rules" id="swapRules"></ul>
    <div class="swap-add-form">
      <label>I don't have…</label>
      <div class="swap-search-wrap">
        <input class="pantry-search" id="swapFromInput" type="text" placeholder="Search ingredient…" autocomplete="off">
        <ul class="pantry-suggest" id="swapFromSuggest"></ul>
      </div>
      <label>Use instead…</label>
      <div class="swap-search-wrap">
        <input class="pantry-search" id="swapToInput" type="text" placeholder="Search what you own…" autocomplete="off">
        <ul class="pantry-suggest" id="swapToSuggest"></ul>
      </div>
      <button class="swap-add-btn" id="swapAddBtn">+ Add swap rule</button>
    </div>
  </div>
</aside>

<!-- Print Modal -->
<div class="modal-overlay" id="printModal">
  <div class="modal" style="max-width:580px">
    <div class="modal-header">
      <span class="modal-title">Print</span>
      <button class="modal-close" id="printModalClose">✕</button>
    </div>
    <div class="modal-body" style="gap:10px">
      <div class="print-tabs">
        <button class="print-tab active" data-print="label">Product Label</button>
        <button class="print-tab" data-print="card">Recipe Card</button>
      </div>
      <div class="print-fields">
        <div class="print-field-row">
          <div class="form-field"><label class="form-label">Brand name</label><input class="form-input" id="pfBrand" value="5 Daughters"></div>
          <div class="form-field"><label class="form-label">Net weight</label><input class="form-input" id="pfWeight" placeholder="e.g. 4 oz / 113g"></div>
        </div>
        <div class="print-field-row">
          <div class="form-field"><label class="form-label">Made on</label><input class="form-input" id="pfDate" type="date"></div>
          <div class="form-field"><label class="form-label">Batch #</label><input class="form-input" id="pfBatch" placeholder="optional"></div>
        </div>
      </div>
      <div class="print-preview" id="printPreview"></div>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel-btn" id="printModalCancel">Cancel</button>
      <button class="modal-save-btn" id="printGo">Print</button>
    </div>
  </div>
</div>

<!-- Hidden print area -->
<div id="printArea"></div>

<!-- Add / Edit Recipe Modal -->
<div class="modal-overlay" id="recipeModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">New Recipe</span>
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label class="form-label">Recipe name *</label>
        <input class="form-input" id="rfName" type="text" placeholder="e.g. Rosewater Toner">
      </div>
      <div class="form-row">
        <div class="form-field">
          <label class="form-label">Category</label>
          <select class="form-select" id="rfCat">
            <option value="face">Face</option>
            <option value="body">Body</option>
            <option value="hair">Hair</option>
            <option value="cleaning">Cleaning</option>
          </select>
        </div>
        <div class="form-field" style="justify-content:flex-end">
          <label class="form-label">&nbsp;</label>
          <div class="form-check-row">
            <input type="checkbox" id="rfHeat">
            <label for="rfHeat">Requires heat</label>
          </div>
        </div>
      </div>
      <div class="form-field">
        <label class="form-label">Source URL (optional)</label>
        <input class="form-input" id="rfUrl" type="url" placeholder="https://…">
      </div>
      <div class="form-field">
        <label class="form-label">Description (optional)</label>
        <textarea class="form-textarea" id="rfDesc" placeholder="Brief description…"></textarea>
      </div>
      <div class="form-field">
        <label class="form-label">Ingredients *</label>
        <div class="ing-rows" id="ingRows"></div>
        <button class="add-ing-btn" id="addIngBtn">+ Add ingredient</button>
      </div>
      <div class="form-field">
        <label class="form-label">Notes (optional)</label>
        <textarea class="form-textarea" id="rfNotes" placeholder="Tips, substitutions…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel-btn" id="modalCancelBtn">Cancel</button>
      <button class="modal-save-btn" id="modalSaveBtn">Save Recipe</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(async () => {
  // Load both libraries in parallel. Public library may not exist on some forks/branches; degrade gracefully.
  const [data, publicLib] = await Promise.all([
    fetch('formulator-data.json').then(r => r.json()),
    fetch('crucible-public-library.json').then(r => r.ok ? r.json() : { recipes: [] }).catch(() => ({ recipes: [] }))
  ]);

  // Public library has a `templates` array we never display, plus an `_unavailableIngredient` flag we hide by default.
  const publicRecipes = (publicLib.recipes || []).filter(r => !r._template && !r._unavailableIngredient);

  const INV_KEY    = '5daughters_inventory';
  const FLAG_KEY   = '5daughters_flagged';
  const NOTES_KEY  = '5daughters_notes';
  const SWAPS_KEY  = '5daughters_swaps';
  const CUSTOM_KEY = '5daughters_custom_recipes';
  const LIB_KEY    = '5daughters_active_library';
  const PAGE_SIZE  = 30;

  let owned   = new Set(JSON.parse(localStorage.getItem(INV_KEY)   || 'null') ?? data.userInventory);
  let flagged = new Set(JSON.parse(localStorage.getItem(FLAG_KEY)  || '[]'));
  let notes   = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}');
  let swaps   = JSON.parse(localStorage.getItem(SWAPS_KEY) || '{}');
  let customRecipes = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]');
  let activeCategory = 'all';
  let activeLibrary = localStorage.getItem(LIB_KEY) || 'public';
  let shownCount = PAGE_SIZE;

  const saveOwned   = () => localStorage.setItem(INV_KEY,   JSON.stringify([...owned]));
  const saveFlagged = () => localStorage.setItem(FLAG_KEY,  JSON.stringify([...flagged]));
  const saveNotes   = () => localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
  const saveSwaps   = () => localStorage.setItem(SWAPS_KEY, JSON.stringify(swaps));
  const saveCustom  = () => localStorage.setItem(CUSTOM_KEY, JSON.stringify(customRecipes));
  const saveLibrary = () => localStorage.setItem(LIB_KEY, activeLibrary);

  // Library is a top-level filter on top of category/search/flags. Custom recipes always flow through (they're yours).
  // - 'public'   = Sqrrlbrain-curated, attribution-clean (sharable, demo-safe)
  // - 'personal' = Your private 705-recipe lab notebook (never shipped to demo users; admin-only when auth is wired)
  // - 'custom'   = Recipes you've authored in-app
  // - 'all'      = Everything you have access to, merged
  function libRecipes() {
    if (activeLibrary === 'public')   return [...customRecipes, ...publicRecipes];
    if (activeLibrary === 'personal') return [...customRecipes, ...data.recipes];
    if (activeLibrary === 'custom')   return [...customRecipes];
    return [...customRecipes, ...publicRecipes, ...data.recipes]; // 'all'
  }
  // Kept for backwards-compat with any older callers; routes through the library filter.
  function allRecipes() { return libRecipes(); }

  function norm(s) { return s.replace(/[™®]/g, '').trim(); }
  function ownedHas(name) { const n = norm(name); return [...owned].some(o => norm(o) === n); }
  function hasIng(name) { return ownedHas(name) || (swaps[name] && ownedHas(swaps[name])); }
  function swapFor(name) { return (!ownedHas(name) && swaps[name] && ownedHas(swaps[name])) ? swaps[name] : null; }
  function matchPct(r) {
    if (!r.ingredients?.length) return 0;
    return Math.round(r.ingredients.filter(i => hasIng(i.name)).length / r.ingredients.length * 100);
  }
  function badgeCls(p) {
    if (p === 100) return 'match-badge match-100';
    if (p >= 75)  return 'match-badge match-high';
    if (p >= 50)  return 'match-badge match-mid';
    return 'match-badge match-low';
  }
  function recipeCategory(r) {
    if (r.category) return r.category;
    if (r.source === 'custom') return 'custom';
    return 'other';
  }

  function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
  function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
  function updateFlagPill() { const p = document.getElementById('flagPill'); p.textContent = flagged.size > 0 ? `★ ${flagged.size}` : ''; }
  function updateInvBadge() { document.getElementById('invBadge').textContent = owned.size; }

  // ── Library pills ──────────────────────────────────────
  // Top-level filter — which source of recipes the user is browsing.
  const LIBS = [
    { id: 'public',   label: 'Public',   count: () => publicRecipes.length,
      desc: 'Sqrrlbrain-curated, attribution-clean. Safe to share; what other Crucible users see.' },
    { id: 'personal', label: 'Personal', count: () => data.recipes.length,
      desc: 'Your private formulation library. Never published.' },
    { id: 'custom',   label: 'My Custom', count: () => customRecipes.length,
      desc: 'Recipes you authored in-app.' },
    { id: 'all',      label: 'All',      count: () => publicRecipes.length + data.recipes.length + customRecipes.length,
      desc: 'Everything you have access to, merged.' },
  ];
  function renderLibPills() {
    const wrap = document.getElementById('libPills'); wrap.textContent = '';
    LIBS.forEach(lib => {
      const b = el('button', 'lib-pill' + (lib.id === activeLibrary ? ' active' : ''));
      b.title = lib.desc;
      b.appendChild(el('span', null, lib.label));
      const cnt = lib.count();
      if (cnt > 0) b.appendChild(el('span', 'lib-count', '· ' + cnt));
      b.addEventListener('click', () => {
        activeLibrary = lib.id;
        saveLibrary();
        shownCount = PAGE_SIZE;
        renderLibPills();
        renderRecipes();
      });
      wrap.appendChild(b);
    });
  }

  // ── Category pills ─────────────────────────────────────
  const CATS = [
    {id:'all',label:'All'},{id:'face',label:'Face'},{id:'body',label:'Body'},
    {id:'hair',label:'Hair'},{id:'cleaning',label:'Cleaning'},{id:'soap',label:'Soap'},
    {id:'makeup',label:'Makeup'},{id:'simple',label:'Simple'},{id:'super-simple',label:'Super Simple'},
    {id:'custom',label:'Custom'},
  ];
  function renderCatPills() {
    const wrap = document.getElementById('catPills'); wrap.textContent = '';
    CATS.forEach(c => {
      const b = el('button', 'cat-pill' + (c.id === activeCategory ? ' active' : ''), c.label);
      b.addEventListener('click', () => { activeCategory = c.id; shownCount = PAGE_SIZE; renderCatPills(); renderRecipes(); });
      wrap.appendChild(b);
    });
  }

  // ── Recommendations ────────────────────────────────────
  function getRecommendations(n = 5) {
    const counts = {};
    allRecipes().forEach(r => {
      if (matchPct(r) === 100) return;
      const missing = r.ingredients.filter(i => !hasIng(i.name));
      missing.forEach(ing => {
        const k = norm(ing.name).toLowerCase();
        if (!counts[k]) counts[k] = { name: ing.name, completes: 0, helps: 0 };
        counts[k].helps++;
        if (missing.length === 1) counts[k].completes++;
      });
    });
    return Object.values(counts)
      .sort((a, b) => (b.completes - a.completes) || (b.helps - a.helps))
      .slice(0, n);
  }

  function renderRecommendations() {
    const sec = document.getElementById('recSection'); sec.textContent = '';
    const recs = getRecommendations();
    if (!recs.length) return;
    sec.appendChild(el('div', 'rec-header', 'What To Buy Next'));
    const ul = el('ul', 'rec-list');
    recs.forEach(r => {
      const li = el('li', 'rec-item');
      li.appendChild(el('span', 'rec-name', r.name));
      if (r.completes > 0) li.appendChild(el('span', 'rec-completes', 'finishes ' + r.completes));
      li.appendChild(el('span', 'rec-helps', 'in ' + r.helps + ' recipes'));
      ul.appendChild(li);
    });
    sec.appendChild(ul);
  }

  // ── Pantry (chips) ─────────────────────────────────────
  function renderPantry() {
    const chips = document.getElementById('pantryChips');
    chips.textContent = '';
    const sorted = [...owned].sort((a,b) => a.localeCompare(b));
    document.getElementById('pantryCount').textContent =
      `${sorted.length} ingredient${sorted.length !== 1 ? 's' : ''} in your pantry`;
    sorted.forEach(ing => {
      const chip = el('div', 'chip');
      chip.appendChild(el('span', null, ing));
      const rm = el('button', 'chip-rm', '✕'); rm.title = 'Remove';
      rm.addEventListener('click', () => { owned.delete(ing); saveOwned(); updateInvBadge(); renderPantry(); renderRecipes(); });
      chip.appendChild(rm); chips.appendChild(chip);
    });
    renderRecommendations();
  }

  // Pantry search autocomplete
  const pantrySearch = document.getElementById('pantrySearch');
  const pantrySuggest = document.getElementById('pantrySuggest');

  function toTitle(s) { return s.trim().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '); }

  function addToPantry(name) {
    const n = toTitle(name);
    if (!n || ownedHas(n)) return;
    if (!data.ingredients.some(i => norm(i).toLowerCase() === norm(n).toLowerCase())) {
      data.ingredients.push(n);
    }
    owned.add(n); saveOwned(); updateInvBadge(); renderPantry(); renderRecipes();
    pantrySearch.value = ''; pantrySuggest.classList.remove('show');
  }

  pantrySearch.addEventListener('input', () => {
    const q = pantrySearch.value.trim().toLowerCase();
    pantrySuggest.textContent = '';
    if (!q) { pantrySuggest.classList.remove('show'); return; }
    const seenNorm = new Set();
    const matches = data.ingredients.filter(i => {
      const n = norm(i).toLowerCase();
      if (ownedHas(i) || !n.includes(q) || seenNorm.has(n)) return false;
      seenNorm.add(n); return true;
    }).slice(0, 10);
    matches.forEach(ing => {
      const li = el('li', null, ing);
      li.addEventListener('mousedown', e => { e.preventDefault(); addToPantry(ing); });
      pantrySuggest.appendChild(li);
    });
    // Always offer "Add [typed]" if exact match isn't already owned
    const typed = pantrySearch.value.trim();
    if (typed && !ownedHas(typed)) {
      const li = document.createElement('li');
      li.style.cssText = 'color:var(--gold);border-top:1px solid var(--border)';
      li.textContent = '+ Add "' + typed + '"';
      li.addEventListener('mousedown', e => { e.preventDefault(); addToPantry(typed); });
      pantrySuggest.appendChild(li);
    }
    pantrySuggest.classList.add('show');
  });
  pantrySearch.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addToPantry(pantrySearch.value); }
  });
  pantrySearch.addEventListener('blur', () => setTimeout(() => pantrySuggest.classList.remove('show'), 150));

  // ── Swaps pane ─────────────────────────────────────────
  function renderSwaps() {
    const list = document.getElementById('swapRules'); list.textContent = '';
    Object.entries(swaps).forEach(([from, to]) => {
      const li = el('li', 'swap-rule');
      li.appendChild(el('span', 'swap-rule-from', from));
      li.appendChild(el('span', 'swap-rule-arr', '→'));
      li.appendChild(el('span', 'swap-rule-to', to));
      const rm = el('button', 'swap-rule-rm', '✕'); rm.title = 'Remove swap';
      rm.addEventListener('click', () => { delete swaps[from]; saveSwaps(); renderSwaps(); renderRecipes(); });
      li.appendChild(rm); list.appendChild(li);
    });
  }

  let swapFromVal = '', swapToVal = '';

  function makeSwapSearch(inputId, suggestId, getList) {
    const inp = document.getElementById(inputId);
    const sug = document.getElementById(suggestId);
    let selectedVal = '';
    inp.addEventListener('input', () => {
      const q = inp.value.trim().toLowerCase();
      sug.textContent = '';
      selectedVal = '';
      if (inputId === 'swapFromInput') swapFromVal = ''; else swapToVal = '';
      if (!q) { sug.classList.remove('show'); return; }
      const seenNorm = new Set();
      const matches = getList().filter(i => {
        const n = norm(i).toLowerCase();
        if (!n.includes(q) || seenNorm.has(n)) return false;
        seenNorm.add(n); return true;
      }).sort((a,b) => a.localeCompare(b)).slice(0, 12);
      if (!matches.length) { sug.classList.remove('show'); return; }
      matches.forEach(ing => {
        const li = el('li', null, ing);
        li.addEventListener('mousedown', e => {
          e.preventDefault();
          inp.value = ing; selectedVal = ing;
          if (inputId === 'swapFromInput') swapFromVal = ing; else swapToVal = ing;
          sug.classList.remove('show');
        });
        sug.appendChild(li);
      });
      sug.classList.add('show');
    });
    inp.addEventListener('blur', () => setTimeout(() => sug.classList.remove('show'), 150));
  }

  makeSwapSearch('swapFromInput', 'swapFromSuggest', () => data.ingredients);
  makeSwapSearch('swapToInput',   'swapToSuggest',   () => [...owned].sort());

  document.getElementById('swapAddBtn').addEventListener('click', () => {
    if (!swapFromVal || !swapToVal || swapFromVal === swapToVal) return;
    swaps[swapFromVal] = swapToVal; saveSwaps(); renderSwaps(); renderRecipes();
    document.getElementById('swapFromInput').value = '';
    document.getElementById('swapToInput').value = '';
    swapFromVal = ''; swapToVal = '';
  });

  // ── Drawer + tabs ──────────────────────────────────────
  function openDrawer()  { document.getElementById('drawer').classList.add('open'); document.getElementById('drawerOverlay').classList.add('open'); }
  function closeDrawer() { document.getElementById('drawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('open'); }

  document.getElementById('openDrawerBtn').addEventListener('click', openDrawer);
  document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
  document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

  document.querySelectorAll('.drawer-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.drawer-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.drawer-pane').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('pane' + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add('active');
    });
  });

  // ── Recipe card ────────────────────────────────────────
  function buildCard(recipe) {
    const pct = matchPct(recipe);
    const card = document.createElement('div');
    card.className = 'recipe-card' + (flagged.has(recipe.id) ? ' flagged-card' : '');

    // Header
    const hdr = el('div', 'recipe-header');
    hdr.appendChild(el('span', badgeCls(pct), pct + '%'));
    hdr.appendChild(el('span', 'recipe-name', recipe.name));
    hdr.appendChild(el('span', 'heat-tag ' + (recipe.heatRequired ? 'heat-yes' : 'heat-no'), recipe.heatRequired ? 'heat' : 'no heat'));
    const flagBtn = el('button', 'flag-btn' + (flagged.has(recipe.id) ? ' flagged' : ''), '★');
    flagBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (flagged.has(recipe.id)) { flagged.delete(recipe.id); flagBtn.classList.remove('flagged'); card.classList.remove('flagged-card'); }
      else                        { flagged.add(recipe.id);    flagBtn.classList.add('flagged');    card.classList.add('flagged-card'); }
      saveFlagged(); updateFlagPill();
    });
    hdr.appendChild(flagBtn);
    hdr.appendChild(el('span', 'chevron', '▶'));

    // Body
    const body = el('div', 'recipe-body');
    if (recipe.description) body.appendChild(el('p', 'recipe-desc', recipe.description));

    // Batch size row
    const batchRow = el('div', 'batch-row');
    batchRow.appendChild(el('span', 'batch-label', 'Batch size:'));
    const batchInp = document.createElement('input');
    batchInp.className = 'batch-input'; batchInp.type = 'number'; batchInp.min = '1'; batchInp.placeholder = 'g';
    batchInp.title = 'Enter total batch weight in grams';
    batchRow.appendChild(batchInp);
    batchRow.appendChild(el('span', 'batch-label', 'g'));
    body.appendChild(batchRow);

    // Ingredient table
    const tbl = document.createElement('table'); tbl.className = 'ing-table';
    const thead = document.createElement('thead'), hr = document.createElement('tr');
    hr.appendChild(el('th', null, 'Ingredient')); hr.appendChild(el('th', null, '%')); hr.appendChild(el('th', null, 'g'));
    thead.appendChild(hr); tbl.appendChild(thead);
    const tbody = document.createElement('tbody');

    (recipe.ingredients || []).forEach(ing => {
      const tr   = document.createElement('tr');
      const sub  = swapFor(ing.name);
      const have = ownedHas(ing.name);
      const tdN  = document.createElement('td');

      if (have) {
        tdN.className = 'ing-have';
        tdN.textContent = '✓ ' + ing.name;
      } else if (sub) {
        tdN.className = 'ing-swap';
        tdN.textContent = '⇄ ' + ing.name + ' → ' + sub;
      } else {
        tdN.className = 'ing-missing';
        const span = el('span', null, '✗ ' + ing.name);
        tdN.appendChild(span);
        const swapBtn = el('button', 'swap-inline-btn', '⇄ swap?');
        swapBtn.addEventListener('click', e => {
          e.stopPropagation();
          swapBtn.style.display = 'none';
          const sel = document.createElement('select'); sel.className = 'swap-inline-select';
          const def = el('option', null, 'use…'); def.value = ''; sel.appendChild(def);
          [...owned].sort().forEach(o => { const opt = el('option', null, o); opt.value = o; sel.appendChild(opt); });
          sel.addEventListener('change', () => {
            if (!sel.value) return;
            swaps[ing.name] = sel.value; saveSwaps(); renderSwaps(); renderRecipes();
          });
          tdN.appendChild(sel);
        });
        tdN.appendChild(swapBtn);
      }

      const tdP = document.createElement('td'); tdP.className = 'pct-cell';
      const inp = document.createElement('input');
      inp.className = 'pct-input'; inp.type = 'number'; inp.step = '0.5'; inp.min = '0'; inp.max = '100'; inp.value = ing.pct;
      inp.addEventListener('input', () => updateTotal(card));
      tdP.appendChild(inp);

      const tdG = document.createElement('td'); tdG.className = 'g-cell'; tdG.textContent = '—';
      tr.appendChild(tdN); tr.appendChild(tdP); tr.appendChild(tdG); tbody.appendChild(tr);
    });
    tbl.appendChild(tbody); body.appendChild(tbl);

    // Wire batch input to g column
    batchInp.addEventListener('input', () => updateTotal(card));

    const totalEl = el('div', 'pct-total pct-warn', '');
    body.appendChild(totalEl);

    if (recipe.process) {
      const tog = el('button', 'process-toggle', '');
      tog.appendChild(el('span', 'ptoggle-arrow', '▶'));
      tog.appendChild(el('span', null, ' Process'));
      const pb = el('div', 'process-body', recipe.process);
      tog.addEventListener('click', () => { tog.classList.toggle('open'); pb.classList.toggle('open'); });
      body.appendChild(tog); body.appendChild(pb);
    }

    if (recipe.notes) body.appendChild(el('div', 'source-notes', recipe.notes));

    // My notes
    body.appendChild(el('span', 'notes-label', 'My notes'));
    const ta = document.createElement('textarea');
    ta.className = 'user-notes' + (notes[recipe.id] ? ' has-notes' : '');
    ta.placeholder = 'Batch notes, subs tried, rating…';
    ta.value = notes[recipe.id] || '';
    ta.addEventListener('input', () => {
      if (ta.value.trim()) { notes[recipe.id] = ta.value; ta.classList.add('has-notes'); }
      else { delete notes[recipe.id]; ta.classList.remove('has-notes'); }
      saveNotes();
    });
    body.appendChild(ta);

    // Actions
    const acts = el('div', 'card-actions');
    const copyBtn = el('button', 'btn btn-gold', 'Copy JSON');
    copyBtn.addEventListener('click', () => {
      const inputs = card.querySelectorAll('.pct-input');
      const t = {...recipe, ingredients: (recipe.ingredients||[]).map((i,idx) => ({...i, pct: parseFloat(inputs[idx]?.value ?? i.pct)}))};
      navigator.clipboard.writeText(JSON.stringify(t, null, 2)).then(() => showToast('Copied'));
    });
    const resetBtn = el('button', 'btn', 'Reset %');
    resetBtn.addEventListener('click', () => {
      card.querySelectorAll('.pct-input').forEach((inp,i) => { inp.value = recipe.ingredients[i]?.pct ?? inp.value; });
      updateTotal(card);
    });
    const printBtn = el('button', 'btn', 'Print');
    printBtn.addEventListener('click', e => { e.stopPropagation(); openPrintModal(recipe); });
    const forkBtn = el('button', 'btn', 'Fork');
    forkBtn.title = 'Save a copy you can edit';
    forkBtn.addEventListener('click', e => { e.stopPropagation(); openRecipeModal(recipe, true); });
    acts.appendChild(copyBtn); acts.appendChild(resetBtn); acts.appendChild(printBtn); acts.appendChild(forkBtn);
    if (recipe.source === 'custom') {
      const editBtn = el('button', 'btn', 'Edit');
      editBtn.addEventListener('click', e => { e.stopPropagation(); openRecipeModal(recipe); });
      const delBtn = el('button', 'btn btn-danger', 'Delete');
      delBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (!confirm('Delete "' + recipe.name + '"?')) return;
        customRecipes = customRecipes.filter(r => r.id !== recipe.id);
        saveCustom(); renderRecipes();
      });
      acts.appendChild(editBtn); acts.appendChild(delBtn);
    }
    // sourceUrl kept in data for internal reference; not shown in UI
    body.appendChild(acts);

    // Shop missing ingredients
    const missing = (recipe.ingredients || []).filter(i => !hasIng(i.name));
    if (missing.length) {
      const SUPPLIERS = [
        { label: 'Bulk Apothecary', url: 'https://www.bulkapothecary.com/search/?q=' },
        { label: 'Making Cosmetics', url: 'https://www.makingcosmetics.com/search?q=' },
        { label: 'Bramble Berry',    url: 'https://www.brambleberry.com/search#q=' },
        { label: 'Amazon',           url: 'https://www.amazon.com/s?k=' },
      ];
      const shopPanel = el('div', 'shop-panel');
      shopPanel.appendChild(el('div', 'shop-panel-header', 'Shop missing ingredients'));
      missing.forEach(ing => {
        const row = el('div', 'shop-row');
        row.appendChild(el('span', 'shop-ing', ing.name));
        const links = el('div', 'shop-links');
        SUPPLIERS.forEach(s => {
          const a = document.createElement('a');
          a.href = s.url + encodeURIComponent(ing.name);
          a.target = '_blank'; a.rel = 'noopener noreferrer';
          a.className = 'shop-link'; a.textContent = s.label;
          links.appendChild(a);
        });
        row.appendChild(links);
        shopPanel.appendChild(row);
      });
      body.appendChild(shopPanel);
    }

    card.appendChild(hdr); card.appendChild(body);
    hdr.addEventListener('click', () => { card.classList.toggle('open'); if (card.classList.contains('open')) updateTotal(card); });
    return card;
  }

  function updateTotal(card) {
    const inputs = card.querySelectorAll('.pct-input');
    const total = [...inputs].reduce((s,i) => s + (parseFloat(i.value)||0), 0);
    const r = Math.round(total * 10) / 10;
    const el2 = card.querySelector('.pct-total');
    if (el2) { el2.textContent = 'Total: ' + r + '%'; el2.className = 'pct-total ' + (Math.abs(r-100) < 0.5 ? 'pct-ok' : 'pct-warn'); }
    const batchG = parseFloat(card.querySelector('.batch-input')?.value) || 0;
    const gCells = card.querySelectorAll('.g-cell');
    inputs.forEach((inp, i) => {
      if (gCells[i]) gCells[i].textContent = batchG > 0 ? (Math.round((parseFloat(inp.value)||0) / 100 * batchG * 10) / 10) + 'g' : '—';
    });
  }

  // ── Render recipes ──────────────────────────────────────
  function getFiltered() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const noHeat = document.getElementById('noHeatOnly').checked;
    const flagOnly = document.getElementById('flaggedOnly').checked;
    return allRecipes()
      .filter(r => {
        if (noHeat  && r.heatRequired)                          return false;
        if (flagOnly && !flagged.has(r.id))                     return false;
        if (activeCategory !== 'all' && recipeCategory(r) !== activeCategory) return false;
        if (q && !r.name.toLowerCase().includes(q) && !(r.description||'').toLowerCase().includes(q)) return false;
        return true;
      })
      .sort((a,b) => { const d = matchPct(b)-matchPct(a); return d !== 0 ? d : a.name.localeCompare(b.name); });
  }

  function renderRecipes() {
    const list = document.getElementById('recipeList'); list.textContent = '';
    const all = getFiltered();
    document.getElementById('resultInfo').textContent = `${all.length} recipe${all.length !== 1 ? 's' : ''}`;
    if (!all.length) { list.appendChild(el('div', 'empty-state', 'No recipes match your filters.')); return; }
    all.slice(0, shownCount).forEach(r => list.appendChild(buildCard(r)));
    if (all.length > shownCount) {
      const more = el('button', 'load-more', `Show ${Math.min(PAGE_SIZE, all.length - shownCount)} more of ${all.length - shownCount} remaining`);
      more.addEventListener('click', () => { shownCount += PAGE_SIZE; renderRecipes(); });
      list.appendChild(more);
    }
    renderRecommendations();
  }

  // ── Print modal ─────────────────────────────────────────
  let printRecipe = null;
  let printMode = 'label';

  function sortedIngs(recipe) {
    return [...(recipe.ingredients || [])].sort((a, b) => b.pct - a.pct);
  }

  function buildLabelHTML(recipe, brand, weight, date, batch) {
    const ings = sortedIngs(recipe).map(i => i.name).join(', ');
    const dateStr = date ? new Date(date).toLocaleDateString() : '';
    return `<div class="label-preview">
      <div class="label-brand">${brand || '5 Daughters'}</div>
      <div class="label-name">${recipe.name}</div>
      <div class="label-ings-head">Ingredients</div>
      <div class="label-ings">${ings}</div>
      <div class="label-warning">For external use only. Keep out of reach of children.</div>
      <div class="label-footer">
        <span>${dateStr ? 'Made: ' + dateStr : ''} ${batch ? '· Batch: ' + batch : ''}</span>
        <span>${weight || ''}</span>
      </div>
    </div>`;
  }

  function buildCardHTML(recipe, brand, weight, date, batch) {
    const ings = sortedIngs(recipe);
    const dateStr = date ? new Date(date).toLocaleDateString() : '';
    const rows = ings.map(i => `<tr><td>${i.name}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${i.pct}%</td></tr>`).join('');
    const meta = [brand, dateStr ? 'Made: ' + dateStr : '', batch ? 'Batch: ' + batch : '', weight].filter(Boolean).join(' · ');
    return `<div class="card-preview">
      <div class="card-title">${recipe.name}</div>
      <div class="card-sub">${meta}</div>
      <table class="card-ing-table"><thead><tr><th>Ingredient</th><th style="text-align:right">%</th></tr></thead><tbody>${rows}</tbody></table>
      ${recipe.process ? `<div class="card-process">${recipe.process}</div>` : ''}
    </div>`;
  }

  function refreshPrintPreview() {
    if (!printRecipe) return;
    const brand = document.getElementById('pfBrand').value;
    const weight = document.getElementById('pfWeight').value;
    const date = document.getElementById('pfDate').value;
    const batch = document.getElementById('pfBatch').value;
    const html = printMode === 'label'
      ? buildLabelHTML(printRecipe, brand, weight, date, batch)
      : buildCardHTML(printRecipe, brand, weight, date, batch);
    document.getElementById('printPreview').innerHTML = html;
  }

  function openPrintModal(recipe) {
    printRecipe = recipe;
    printMode = 'label';
    document.querySelectorAll('.print-tab').forEach(t => t.classList.toggle('active', t.dataset.print === 'label'));
    document.getElementById('pfDate').value = new Date().toISOString().slice(0, 10);
    refreshPrintPreview();
    document.getElementById('printModal').classList.add('open');
  }

  document.querySelectorAll('.print-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      printMode = tab.dataset.print;
      document.querySelectorAll('.print-tab').forEach(t => t.classList.toggle('active', t === tab));
      refreshPrintPreview();
    });
  });
  ['pfBrand','pfWeight','pfDate','pfBatch'].forEach(id =>
    document.getElementById(id).addEventListener('input', refreshPrintPreview)
  );

  document.getElementById('printModalClose').addEventListener('click', () => document.getElementById('printModal').classList.remove('open'));
  document.getElementById('printModalCancel').addEventListener('click', () => document.getElementById('printModal').classList.remove('open'));
  document.getElementById('printModal').addEventListener('click', e => { if (e.target === e.currentTarget) document.getElementById('printModal').classList.remove('open'); });

  document.getElementById('printGo').addEventListener('click', () => {
    const pa = document.getElementById('printArea');
    pa.innerHTML = document.getElementById('printPreview').innerHTML;
    window.print();
    pa.innerHTML = '';
  });

  // ── Custom recipe modal ─────────────────────────────────
  let editingId = null;

  function makeIngRow(name, pct) {
    const row = el('div', 'ing-row');
    const ni = document.createElement('input'); ni.className = 'ing-row-name'; ni.type = 'text'; ni.placeholder = 'Ingredient name'; ni.value = name || '';
    const pi = document.createElement('input'); pi.className = 'ing-row-pct'; pi.type = 'number'; pi.placeholder = '%'; pi.min = '0'; pi.max = '100'; pi.step = '0.5'; pi.value = pct || '';
    const rm = el('button', 'ing-row-rm', '✕'); rm.type = 'button'; rm.title = 'Remove';
    rm.addEventListener('click', () => row.remove());
    row.appendChild(ni); row.appendChild(pi); row.appendChild(rm);
    return row;
  }

  function openRecipeModal(recipe, isFork) {
    editingId = (recipe && !isFork) ? recipe.id : null;
    document.getElementById('modalTitle').textContent = isFork ? 'Fork Recipe' : (recipe ? 'Edit Recipe' : 'New Recipe');
    document.getElementById('rfName').value  = isFork ? (recipe.name + ' (Fork)') : (recipe?.name || '');
    document.getElementById('rfCat').value   = recipe?.category || 'face';
    document.getElementById('rfHeat').checked = recipe?.heatRequired || false;
    document.getElementById('rfUrl').value   = recipe?.sourceUrl || '';
    document.getElementById('rfDesc').value  = recipe?.description || '';
    document.getElementById('rfNotes').value = recipe?.notes || '';
    const rows = document.getElementById('ingRows'); rows.textContent = '';
    const ings = recipe?.ingredients?.length ? recipe.ingredients : [{name:'',pct:''}];
    ings.forEach(i => rows.appendChild(makeIngRow(i.name, i.pct)));
    document.getElementById('recipeModal').classList.add('open');
    document.getElementById('rfName').focus();
  }

  function closeRecipeModal() {
    document.getElementById('recipeModal').classList.remove('open');
    editingId = null;
  }

  document.getElementById('newRecipeBtn').addEventListener('click', () => openRecipeModal(null));
  document.getElementById('modalCloseBtn').addEventListener('click', closeRecipeModal);
  document.getElementById('modalCancelBtn').addEventListener('click', closeRecipeModal);
  document.getElementById('recipeModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeRecipeModal(); });
  document.getElementById('addIngBtn').addEventListener('click', () => {
    document.getElementById('ingRows').appendChild(makeIngRow('', ''));
  });

  document.getElementById('modalSaveBtn').addEventListener('click', () => {
    const name = document.getElementById('rfName').value.trim();
    if (!name) { document.getElementById('rfName').focus(); return; }
    const ings = [...document.getElementById('ingRows').querySelectorAll('.ing-row')].map(row => ({
      name: toTitle(row.querySelector('.ing-row-name').value),
      pct: parseFloat(row.querySelector('.ing-row-pct').value) || 0,
    })).filter(i => i.name);
    if (!ings.length) { alert('Add at least one ingredient.'); return; }
    const recipe = {
      id: editingId || ('custom-' + Date.now()),
      name,
      source: 'custom',
      category: document.getElementById('rfCat').value,
      sourceUrl: document.getElementById('rfUrl').value.trim(),
      heatRequired: document.getElementById('rfHeat').checked,
      equipment: [],
      description: document.getElementById('rfDesc').value.trim(),
      ingredients: ings,
      notes: document.getElementById('rfNotes').value.trim(),
    };
    if (editingId) {
      const idx = customRecipes.findIndex(r => r.id === editingId);
      if (idx !== -1) customRecipes[idx] = recipe; else customRecipes.unshift(recipe);
    } else {
      customRecipes.unshift(recipe);
    }
    saveCustom(); closeRecipeModal(); renderRecipes();
    showToast(editingId ? 'Recipe updated' : 'Recipe saved');
  });

  // ── Wire up ─────────────────────────────────────────────
  let st;
  document.getElementById('searchInput').addEventListener('input', () => { clearTimeout(st); shownCount = PAGE_SIZE; st = setTimeout(renderRecipes, 160); });
  document.getElementById('noHeatOnly').addEventListener('change', () => { shownCount = PAGE_SIZE; renderRecipes(); });
  document.getElementById('flaggedOnly').addEventListener('change', () => { shownCount = PAGE_SIZE; renderRecipes(); });

  renderLibPills(); renderCatPills(); renderPantry(); renderSwaps(); renderRecipes(); updateFlagPill(); updateInvBadge();
})();
</script>
