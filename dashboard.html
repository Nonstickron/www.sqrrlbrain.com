<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/svg+xml" href="images/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #090805;
      --surface:    #131009;
      --surface-hi: #1c180e;
      --border:     #2a2218;
      --border-hi:  #3e3228;
      --gold:       #c4993a;
      --gold-dim:   #7a5f22;
      --text:       #cbbfa8;
      --text-dim:   #6a5f4a;
      --text-mid:   #9a8e78;
      --urgent:     #e05050;
      --blocked:    #c47a3a;
      --active:     #5a9e6a;
      --indev:      #3a8ab0;
      --concept:    #8a5aaa;
      --todo:       #5a7a4a;
      --shelved:    #3a3028;
      --mono:       'DM Mono', monospace;
      --serif:      'Cormorant Garamond', serif;
    }

    html { background: var(--bg); }
    body { background: var(--bg); color: var(--text); font-family: var(--mono); font-weight: 300; min-height: 100vh; overflow-x: hidden; }

    /* AUTH GATE */
    #sqrrl-gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    #sqrrl-gate p { font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; color: var(--text-dim); }

    /* HEADER */
    header { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2.4rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 2rem; }
    .header-left img { height: 32px; width: auto; filter: invert(1) sepia(1) saturate(0.6) brightness(0.75); opacity: .7; }
    .header-title { display: flex; flex-direction: column; gap: .1rem; }
    .header-eyebrow { font-size: .56rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-dim); }
    .header-name { font-family: var(--serif); font-size: 1.1rem; font-weight: 700; color: var(--text); line-height: 1; }
    .header-right { display: flex; align-items: center; gap: 2.4rem; }
    #live-clock { font-size: .6rem; letter-spacing: .1em; color: var(--text-dim); text-align: right; }
    #clock-date { margin-bottom: .1rem; }
    #clock-time { color: var(--gold-dim); font-size: .7rem; }
    .sign-out-btn { font-family: var(--mono); font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); background: none; border: 1px solid var(--border); padding: .4rem .9rem; cursor: pointer; transition: all .15s; }
    .sign-out-btn:hover { border-color: var(--border-hi); color: var(--text); }

    /* STATS BAR */
    .stats-bar { display: flex; align-items: center; padding: 0 2.4rem; border-bottom: 1px solid var(--border); background: var(--surface); overflow-x: auto; }
    .stat-block { display: flex; align-items: center; gap: .6rem; padding: .9rem 1.8rem .9rem 0; margin-right: 1.8rem; border-right: 1px solid var(--border); white-space: nowrap; flex-shrink: 0; }
    .stat-block:last-of-type { border-right: none; }
    .stat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .stat-dot.urgent  { background: var(--urgent); }
    .stat-dot.blocked { background: var(--blocked); }
    .stat-dot.active  { background: var(--active); }
    .stat-dot.indev   { background: var(--indev); }
    .stat-dot.concept { background: var(--concept); }
    .stat-count { font-size: .8rem; font-weight: 500; color: var(--text); }
    .stat-label { font-size: .56rem; letter-spacing: .16em; text-transform: uppercase; color: var(--text-dim); }
    .tools-quick { margin-left: auto; display: flex; gap: .8rem; align-items: center; padding-left: 2rem; flex-shrink: 0; }
    .tool-link { font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); text-decoration: none; border: 1px solid var(--border); padding: .3rem .8rem; transition: all .15s; }
    .tool-link:hover { color: var(--gold); border-color: var(--gold-dim); }

    /* GRID */
    main { padding: 2rem 2.4rem 4rem; }
    .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); }

    /* CARD */
    .card { background: var(--surface); padding: 1.6rem; cursor: pointer; transition: background .15s; position: relative; overflow: hidden; }
    .card:hover { background: var(--surface-hi); }
    .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--status-color, transparent); opacity: 0; transition: opacity .2s; }
    .card:hover::before, .card.open::before { opacity: 1; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; gap: .5rem; }
    .card-category { font-size: .56rem; letter-spacing: .16em; text-transform: uppercase; color: var(--text-dim); }
    .status-badge { font-size: .54rem; letter-spacing: .14em; text-transform: uppercase; padding: .2rem .5rem; border: 1px solid currentColor; display: flex; align-items: center; gap: .4rem; flex-shrink: 0; }
    .status-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .status-badge.urgent  { color: var(--urgent); }
    .status-badge.blocked { color: var(--blocked); }
    .status-badge.active  { color: var(--active); }
    .status-badge.indev   { color: var(--indev); }
    .status-badge.concept { color: var(--concept); }
    .status-badge.todo    { color: var(--todo); }
    .status-badge.shelved { color: var(--shelved); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .status-badge.urgent .dot, .status-badge.blocked .dot { animation: pulse 2s ease infinite; }
    .card-name { font-family: var(--serif); font-size: 1.55rem; font-weight: 600; line-height: 1.1; color: var(--text); margin-bottom: .6rem; }
    .card-summary { font-size: .75rem; line-height: 1.7; color: var(--text-mid); margin-bottom: 1.2rem; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .card-updated { font-size: .55rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }
    .card-expand { font-size: .58rem; letter-spacing: .1em; color: var(--text-dim); transition: transform .25s, color .15s; }
    .card.open .card-expand { transform: rotate(180deg); color: var(--gold-dim); }

    /* EXPANDED */
    .card-details { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(0.4,0,0.2,1); }
    .card.open .card-details { max-height: 1200px; }
    .card-details-inner { padding-top: 1.2rem; border-top: 1px solid var(--border); margin-top: 1.2rem; }
    .details-section-label { font-size: .54rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: .7rem; margin-top: 1rem; }
    .details-section-label:first-child { margin-top: 0; }

    .steps-list { list-style: none; }
    .steps-list li { font-size: .72rem; line-height: 1.6; color: var(--text-mid); padding: .3rem 0 .3rem 1.2rem; position: relative; border-bottom: 1px solid var(--border); }
    .steps-list li:last-child { border-bottom: none; }
    .steps-list li::before { content: '→'; position: absolute; left: 0; color: var(--text-dim); font-size: .6rem; }

    .blockers-list { list-style: none; }
    .blockers-list li { font-size: .7rem; line-height: 1.6; color: var(--blocked); padding: .35rem 0 .35rem 1.4rem; position: relative; border-bottom: 1px solid rgba(196,122,58,.15); }
    .blockers-list li:last-child { border-bottom: none; }
    .blockers-list li::before { content: '!'; position: absolute; left: 0; font-weight: 500; }
    .blockers-urgent li { color: var(--urgent); border-bottom-color: rgba(224,80,80,.15); }
    .blockers-urgent li::before { content: '!!'; font-size: .6rem; }

    /* SUBPROJECTS */
    .subprojects-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); margin-top: .4rem; }
    .sub-card { background: var(--bg); padding: 1rem 1rem; cursor: pointer; transition: background .15s; position: relative; }
    .sub-card:hover { background: var(--surface); }
    .sub-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--sub-status-color, transparent); opacity: 0; transition: opacity .2s; }
    .sub-card:hover::before, .sub-card.open::before { opacity: 1; }
    .sub-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
    .sub-label { font-size: .52rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); }
    .sub-status { font-size: .5rem; letter-spacing: .1em; text-transform: uppercase; padding: .15rem .4rem; border: 1px solid currentColor; display: flex; align-items: center; gap: .3rem; }
    .sub-status .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
    .sub-status.urgent  { color: var(--urgent); }
    .sub-status.blocked { color: var(--blocked); }
    .sub-status.active  { color: var(--active); }
    .sub-status.todo    { color: var(--todo); }
    .sub-status.indev   { color: var(--indev); }
    .sub-name { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; color: var(--text); margin-bottom: .35rem; line-height: 1.15; }
    .sub-summary { font-size: .68rem; line-height: 1.6; color: var(--text-mid); }
    .sub-expand { display: flex; justify-content: flex-end; margin-top: .5rem; }
    .sub-expand-icon { font-size: .5rem; color: var(--text-dim); transition: transform .25s; }
    .sub-card.open .sub-expand-icon { transform: rotate(180deg); color: var(--gold-dim); }
    .sub-details { max-height: 0; overflow: hidden; transition: max-height .35s cubic-bezier(0.4,0,0.2,1); }
    .sub-card.open .sub-details { max-height: 400px; }
    .sub-details-inner { padding-top: .8rem; border-top: 1px solid var(--border); margin-top: .8rem; }
    .sub-steps { list-style: none; }
    .sub-steps li { font-size: .65rem; line-height: 1.6; color: var(--text-mid); padding: .25rem 0 .25rem 1rem; position: relative; border-bottom: 1px solid var(--border); }
    .sub-steps li:last-child { border-bottom: none; }
    .sub-steps li::before { content: '→'; position: absolute; left: 0; color: var(--text-dim); font-size: .55rem; }

    /* CARD IN ANIMATION */
    @keyframes cardIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .card { animation: cardIn .4s ease both; }

    /* FOOTER */
    footer { border-top: 1px solid var(--border); padding: 1.2rem 2.4rem; display: flex; justify-content: space-between; align-items: center; }
    footer p { font-size: .56rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }
    footer a { color: var(--text-dim); text-decoration: none; font-size: .56rem; letter-spacing: .1em; text-transform: uppercase; }
    footer a:hover { color: var(--gold-dim); }

    @media (max-width: 1000px) { .projects-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 640px)  { .projects-grid, .subprojects-grid { grid-template-columns: 1fr; } header { padding: 1rem 1.2rem; } main { padding: 1.2rem 1.2rem 3rem; } .stats-bar { padding: 0 1.2rem; } .tools-quick { display: none; } }
  </style>

    el.textContent = str;

  }

  // ─── DOM BUILDERS ─────────────────────────────────────────────────────────
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;

  // ─── BUILD STATUS BADGE (DOM) ─────────────────────────────────────────────
  function buildBadge(status, label, small) {
    const badge = el('span', (small ? 'sub-status ' : 'status-badge ') + status);
    const dot = el('span', 'dot');
    badge.appendChild(dot);
    badge.appendChild(document.createTextNode(label));
    return badge;
  }

  // ─── BUILD SUBPROJECT CARD ────────────────────────────────────────────────
  function buildSubCard(sub, delay) {
    const color = STATUS_COLORS[sub.status] || '#4a4038';
    const card = el('div', 'sub-card');
    card.style.cssText = '--sub-status-color:' + color + ';animation-delay:' + delay + 's';

    const top = el('div', 'sub-top');
    ap(top, el('span', 'sub-label', sub.category), buildBadge(sub.status, sub.statusLabel, true));

    const name = el('div', 'sub-name', sub.name);
    const summary = el('div', 'sub-summary', sub.summary);

    const expandRow = el('div', 'sub-expand');
    const expandIcon = el('span', 'sub-expand-icon', '▼');
    expandRow.appendChild(expandIcon);

    const details = el('div', 'sub-details');
    const inner = el('div', 'sub-details-inner');
    if (sub.steps && sub.steps.length) {
      const lbl = el('div', 'details-section-label', 'Steps');
      lbl.style.marginTop = '0';
      const list = el('ul', 'sub-steps');
      sub.steps.forEach(s => {
        const li = el('li', '', s);
        list.appendChild(li);
      });
      ap(inner, lbl, list);
    }
    details.appendChild(inner);

    ap(card, top, name, summary, expandRow, details);

    card.addEventListener('click', e => {
      e.stopPropagation();
      card.classList.toggle('open');
    });
    return card;
  }

  // ─── BUILD PROJECT CARD ───────────────────────────────────────────────────
  function buildCard(p, index) {
    const color = STATUS_COLORS[p.status] || '#4a4038';
    const card = el('div', 'card');
    card.style.cssText = '--status-color:' + color + ';animation-delay:' + (index * 0.05) + 's';

    // Top row
    const top = el('div', 'card-top');
    ap(top, el('span', 'card-category', p.category), buildBadge(p.status, p.statusLabel, false));

    const name = el('div', 'card-name', p.name);
    const summary = el('div', 'card-summary', p.summary);

    // Footer row
    const footer = el('div', 'card-footer');
    const updated = el('span', 'card-updated', 'Updated ' + p.updated);
    const expandIcon = el('span', 'card-expand', '▼');
    ap(footer, updated, expandIcon);

    // Expanded area
    const details = el('div', 'card-details');
    const inner = el('div', 'card-details-inner');

    if (p.steps && p.steps.length) {
      const stepsLbl = el('div', 'details-section-label', 'Next Steps');
      stepsLbl.style.marginTop = '0';
      const stepsList = el('ul', 'steps-list');
      p.steps.forEach(s => stepsList.appendChild(el('li', '', s)));
      ap(inner, stepsLbl, stepsList);
    }

    if (p.blockers && p.blockers.length) {
      const blkLbl = el('div', 'details-section-label', 'Blockers');
      const blkList = el('ul', p.blockerUrgent ? 'blockers-urgent blockers-list' : 'blockers-list');
      p.blockers.forEach(b => blkList.appendChild(el('li', '', b)));
      ap(inner, blkLbl, blkList);
    }

    if (p.subprojects && p.subprojects.length) {
      const subLbl = el('div', 'details-section-label', 'Sub-Projects');
      const subGrid = el('div', 'subprojects-grid');
      p.subprojects.forEach((sub, i) => subGrid.appendChild(buildSubCard(sub, i * 0.04)));
      ap(inner, subLbl, subGrid);
    }

    details.appendChild(inner);
    ap(card, top, name, summary, footer, details);

    card.addEventListener('click', () => {
      const isOpen = card.classList.contains('open');
      document.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));
      if (!isOpen) card.classList.add('open');
    });

    return card;
  }

  // ─── RENDER STATS BAR ─────────────────────────────────────────────────────
  function renderStats() {
    const counts = {};
    PROJECTS.forEach(p => counts[p.status] = (counts[p.status] || 0) + 1);
    const labels = { urgent:'Urgent', blocked:'Blocked', active:'Active', indev:'In Dev', concept:'Concept' };
    const bar = document.getElementById('stats-bar');

    Object.entries(labels).filter(([k]) => counts[k]).forEach(([k, v]) => {
      const block = el('div', 'stat-block');
      const dot   = el('div', 'stat-dot ' + k);
      const count = el('span', 'stat-count', String(counts[k] || 0));
      const lbl   = el('span', 'stat-label', v);
      ap(block, dot, count, lbl);
      bar.appendChild(block);
    });

    const tools = el('div', 'tools-quick');
    [['Crucible','/crucible.html'],['SqrrlNest','/sqrrlnest.html'],['Billing','/sqrrlbrain-billing.html'],['Dashboard','#']].forEach(([name, href]) => {
      const a = el('a', 'tool-link', name);
      a.href = href;
      tools.appendChild(a);
    });
    bar.appendChild(tools);
  }

  // ─── RENDER GRID ──────────────────────────────────────────────────────────
  function renderGrid() {
    const sorted = [...PROJECTS].sort((a, b) =>
      STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status)
    );
    const grid = document.getElementById('projects-grid');
    sorted.forEach((p, i) => grid.appendChild(buildCard(p, i)));
  }

  // ─── LIVE CLOCK ───────────────────────────────────────────────────────────
  function updateClock() {
    const now = new Date();
    document.getElementById('clock-date').textContent =
      now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}).toUpperCase();
    document.getElementById('clock-time').textContent =
      now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ─── BOOT ─────────────────────────────────────────────────────────────────
  renderStats();
  renderGrid();
  SqrrlAuth.check();
  </script>
</body>
</html>
