<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Control — Sqrrlbrain Studio</title>
  <link rel="icon" type="image/svg+xml" href="images/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Brand palette — matches public sqrrlbrain.com (about.html) */
      --ink:         #3a1a00;
      --brown-mid:   #7a4520;
      --brown-light: #b88c5a;
      --paper:       #faf6f0;
      --warm:        #f2ebe0;
      --warm-hi:     #ece2d0;
      --line:        rgba(58,26,0,.10);
      --line-hi:     rgba(58,26,0,.18);
      --accent:      #c8421a;
      --accent-soft: rgba(200,66,26,.10);
      --warm-yellow: #f4bc43;

      /* Status palette — kept semantic, retuned slightly for paper bg */
      --urgent:     #c8421a;
      --blocked:    #c47a3a;
      --active:     #4f8a5a;
      --indev:      #3a7da0;
      --concept:    #7a4f9a;
      --todo:       #6a8a4a;
      --shelved:    #b0a48e;

      --serif:      'Lora', serif;
      --sans:       'DM Sans', sans-serif;
      --mono:       'DM Mono', monospace;
    }

    html { background: var(--paper); scroll-behavior: smooth; }
    body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 400; min-height: 100vh; overflow-x: hidden; }

    /* Subtle paper-grain noise overlay (matches about.html) */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* AUTH GATE */
    #sqrrl-gate { position: fixed; inset: 0; background: var(--paper); display: flex; align-items: center; justify-content: center; z-index: 10000; }
    #sqrrl-gate p { font-family: var(--mono); font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; color: var(--brown-mid); }

    /* HEADER */
    header { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2.4rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--paper); z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 2rem; }
    .header-left img { height: 36px; width: auto; opacity: .92; }
    .header-title { display: flex; flex-direction: column; gap: .15rem; }
    .header-eyebrow { font-family: var(--mono); font-size: .58rem; letter-spacing: .22em; text-transform: uppercase; color: var(--brown-mid); }
    .header-name { font-family: var(--serif); font-size: 1.15rem; font-weight: 700; color: var(--ink); line-height: 1; }
    .header-right { display: flex; align-items: center; gap: 2.2rem; }
    #live-clock { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; color: var(--brown-mid); text-align: right; }
    #clock-date { margin-bottom: .15rem; }
    #clock-time { color: var(--accent); font-size: .72rem; font-weight: 500; }
    .sign-out-btn { font-family: var(--mono); font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--brown-mid); background: none; border: 1px solid var(--line-hi); padding: .42rem .9rem; cursor: pointer; transition: all .15s; }
    .sign-out-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ACCENT RULE — solid vermilion (sticky under header) */
    .pride-strip {
      height: 6px;
      width: 100%;
      background: var(--accent);
      position: sticky;
      top: 65px;
      z-index: 99;
      border-bottom: 1px solid var(--line);
    }

    /* STATS BAR */
    .stats-bar { display: flex; align-items: center; padding: 0 2.4rem; border-bottom: 1px solid var(--line); background: var(--warm); overflow-x: auto; }
    .stat-block { display: flex; align-items: center; gap: .65rem; padding: .9rem 1.8rem .9rem 0; margin-right: 1.8rem; border-right: 1px solid var(--line); white-space: nowrap; flex-shrink: 0; }
    .stat-block:last-of-type { border-right: none; }
    .stat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,.4) inset; }
    .stat-dot.urgent  { background: var(--urgent); }
    .stat-dot.blocked { background: var(--blocked); }
    .stat-dot.active  { background: var(--active); }
    .stat-dot.indev   { background: var(--indev); }
    .stat-dot.concept { background: var(--concept); }
    .stat-dot.todo    { background: var(--todo); }
    .stat-dot.shelved { background: var(--shelved); }
    .stat-count { font-family: var(--serif); font-size: .95rem; font-weight: 600; color: var(--ink); }
    .stat-label { font-family: var(--mono); font-size: .58rem; letter-spacing: .16em; text-transform: uppercase; color: var(--brown-mid); }
    .tools-quick { margin-left: auto; display: flex; gap: .8rem; align-items: center; padding-left: 2rem; flex-shrink: 0; }
    .tool-link { font-family: var(--mono); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--brown-mid); text-decoration: none; border: 1px solid var(--line-hi); padding: .35rem .8rem; transition: all .15s; }
    .tool-link:hover { color: var(--accent); border-color: var(--accent); background: var(--paper); }

    /* GRID */
    main { padding: 2rem 2.4rem 4rem; }
    .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }

    /* CARD */
    .card { background: var(--paper); padding: 1.6rem; cursor: pointer; transition: background .15s; position: relative; overflow: hidden; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .card:hover { background: var(--warm); }
    .card.open { background: var(--warm); }
    .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--status-color, transparent); opacity: 0; transition: opacity .2s; }
    .card:hover::before, .card.open::before { opacity: 1; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; gap: .5rem; }
    .card-category { font-family: var(--mono); font-size: .58rem; letter-spacing: .16em; text-transform: uppercase; color: var(--brown-mid); }
    .status-badge { font-family: var(--mono); font-size: .56rem; letter-spacing: .14em; text-transform: uppercase; padding: .22rem .55rem; border: 1px solid currentColor; display: flex; align-items: center; gap: .42rem; flex-shrink: 0; background: var(--paper); }
    .status-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .status-badge.urgent  { color: var(--urgent); }
    .status-badge.blocked { color: var(--blocked); }
    .status-badge.active  { color: var(--active); }
    .status-badge.indev   { color: var(--indev); }
    .status-badge.concept { color: var(--concept); }
    .status-badge.todo    { color: var(--todo); }
    .status-badge.shelved { color: var(--shelved); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .status-badge.urgent .dot, .status-badge.blocked .dot { animation: pulse 2s ease infinite; }
    .card-name { font-family: var(--serif); font-size: 1.55rem; font-weight: 600; line-height: 1.15; color: var(--ink); margin-bottom: .6rem; letter-spacing: -.005em; }
    .card-name .em { font-style: italic; color: var(--accent); }
    .card-summary { font-size: .82rem; line-height: 1.65; color: var(--brown-mid); margin-bottom: 1.2rem; font-weight: 400; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .card-updated { font-family: var(--mono); font-size: .56rem; letter-spacing: .12em; text-transform: uppercase; color: var(--brown-mid); }
    .card-expand { font-size: .6rem; color: var(--brown-mid); transition: transform .25s, color .15s; }
    .card.open .card-expand { transform: rotate(180deg); color: var(--accent); }

    /* EXPANDED */
    .card-details { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(0.4,0,0.2,1); }
    .card.open .card-details { max-height: 2400px; }
    .card-details-inner { padding-top: 1.2rem; border-top: 1px solid var(--line); margin-top: 1.2rem; }
    .details-section-label { font-family: var(--mono); font-size: .56rem; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: .7rem; margin-top: 1rem; font-weight: 500; }
    .details-section-label:first-child { margin-top: 0; }

    .steps-list { list-style: none; }
    .steps-list li { font-size: .82rem; line-height: 1.6; color: var(--ink); padding: .35rem 0 .35rem 1.4rem; position: relative; border-bottom: 1px solid var(--line); }
    .steps-list li:last-child { border-bottom: none; }
    .steps-list li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-size: .8rem; line-height: 1.5; }
    .steps-list li.shipped::before { content: '✓'; color: var(--warm-yellow); font-weight: 700; }
    .steps-list li.shipped { color: var(--brown-mid); }

    .blockers-list { list-style: none; }
    .blockers-list li { font-size: .8rem; line-height: 1.6; color: var(--blocked); padding: .4rem 0 .4rem 1.5rem; position: relative; border-bottom: 1px solid rgba(196,122,58,.18); }
    .blockers-list li:last-child { border-bottom: none; }
    .blockers-list li::before { content: '!'; position: absolute; left: 0; font-weight: 700; }
    .blockers-urgent li { color: var(--urgent); border-bottom-color: rgba(200,66,26,.18); }
    .blockers-urgent li::before { content: '!!'; font-size: .7rem; }

    /* SUBPROJECTS */
    .subprojects-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: .4rem; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .sub-card { background: var(--paper); padding: 1rem 1rem; cursor: pointer; transition: background .15s; position: relative; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .sub-card:hover { background: var(--warm); }
    .sub-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--sub-status-color, transparent); opacity: 0; transition: opacity .2s; }
    .sub-card:hover::before, .sub-card.open::before { opacity: 1; }
    .sub-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
    .sub-label { font-family: var(--mono); font-size: .54rem; letter-spacing: .14em; text-transform: uppercase; color: var(--brown-mid); }
    .sub-status { font-family: var(--mono); font-size: .52rem; letter-spacing: .1em; text-transform: uppercase; padding: .18rem .45rem; border: 1px solid currentColor; display: flex; align-items: center; gap: .32rem; background: var(--paper); }
    .sub-status .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
    .sub-status.urgent  { color: var(--urgent); }
    .sub-status.blocked { color: var(--blocked); }
    .sub-status.active  { color: var(--active); }
    .sub-status.todo    { color: var(--todo); }
    .sub-status.indev   { color: var(--indev); }
    .sub-status.concept { color: var(--concept); }
    .sub-name { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; color: var(--ink); margin-bottom: .35rem; line-height: 1.2; }
    .sub-summary { font-size: .74rem; line-height: 1.55; color: var(--brown-mid); }
    .sub-expand { display: flex; justify-content: flex-end; margin-top: .5rem; }
    .sub-expand-icon { font-size: .54rem; color: var(--brown-mid); transition: transform .25s; }
    .sub-card.open .sub-expand-icon { transform: rotate(180deg); color: var(--accent); }
    .sub-details { max-height: 0; overflow: hidden; transition: max-height .35s cubic-bezier(0.4,0,0.2,1); }
    .sub-card.open .sub-details { max-height: 400px; }
    .sub-details-inner { padding-top: .8rem; border-top: 1px solid var(--line); margin-top: .8rem; }
    .sub-steps { list-style: none; }
    .sub-steps li { font-size: .72rem; line-height: 1.55; color: var(--ink); padding: .25rem 0 .25rem 1.2rem; position: relative; border-bottom: 1px solid var(--line); }
    .sub-steps li:last-child { border-bottom: none; }
    .sub-steps li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-size: .65rem; line-height: 1.5; }

    /* CARD IN ANIMATION */
    @keyframes cardIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .card { animation: cardIn .4s ease both; }

    /* FOOTER */
    footer { border-top: 1px solid var(--line); padding: 1.2rem 2.4rem; display: flex; justify-content: space-between; align-items: center; background: var(--paper); }
    footer p { font-family: var(--mono); font-size: .58rem; letter-spacing: .12em; text-transform: uppercase; color: var(--brown-mid); }
    footer a { color: var(--brown-mid); text-decoration: none; font-family: var(--mono); font-size: .58rem; letter-spacing: .12em; text-transform: uppercase; }
    footer a:hover { color: var(--accent); }

    /* SUMMARY VIEW */
    .summary-view { display: grid; grid-template-columns: 280px 1fr; border-bottom: 1px solid var(--line); background: var(--warm); }
    .summary-donut-panel { padding: 1.8rem 2.4rem; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }
    .donut-wrap { position: relative; width: 132px; height: 132px; flex-shrink: 0; }
    .donut-ring { width: 100%; height: 100%; border-radius: 50%; }
    .donut-hole { position: absolute; inset: 22px; background: var(--warm); border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line); }
    .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
    .donut-total { font-family: var(--serif); font-size: 2.1rem; font-weight: 600; color: var(--ink); line-height: 1; }
    .donut-label { font-family: var(--mono); font-size: .48rem; letter-spacing: .22em; text-transform: uppercase; color: var(--brown-mid); margin-top: .25rem; }
    .donut-legend { display: flex; flex-direction: column; gap: .4rem; width: 100%; }
    .legend-row { display: flex; align-items: center; gap: .55rem; font-family: var(--mono); font-size: .64rem; color: var(--ink); }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,.4) inset; }
    .legend-val { margin-left: auto; color: var(--brown-mid); font-size: .62rem; }

    .summary-right { padding: 1.8rem 2.4rem; display: flex; flex-direction: column; gap: 1.2rem; min-width: 0; background: var(--paper); }
    .summary-top-row { display: flex; align-items: flex-start; gap: 3rem; }
    .health-block { flex-shrink: 0; }
    .health-score { font-family: var(--serif); font-size: 2.9rem; font-weight: 600; line-height: 1; letter-spacing: -.025em; }
    .health-score.hi  { color: var(--active); }
    .health-score.mid { color: var(--accent); }
    .health-score.lo  { color: var(--blocked); }
    .health-label { font-family: var(--mono); font-size: .54rem; letter-spacing: .2em; text-transform: uppercase; color: var(--brown-mid); margin-top: .35rem; }
    .health-sub { font-family: var(--mono); font-size: .62rem; color: var(--brown-mid); margin-top: .25rem; }

    .activity-section { flex: 1; min-width: 0; }
    .activity-label { font-family: var(--mono); font-size: .54rem; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin-bottom: .6rem; }
    .activity-bars { display: flex; flex-direction: column; gap: .5rem; }
    .activity-row { display: grid; grid-template-columns: 100px 1fr 36px; gap: .6rem; align-items: center; }
    .activity-name { font-size: .68rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .activity-bar-track { height: 4px; background: var(--warm-hi); border-radius: 2px; overflow: hidden; }
    .activity-bar-fill { height: 100%; border-radius: 2px; }
    .activity-days { font-family: var(--mono); font-size: .54rem; color: var(--brown-mid); text-align: right; white-space: nowrap; }

    /* NOTES */
    .notes-section { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
    .notes-textarea { width: 100%; background: var(--paper); border: 1px solid var(--line-hi); color: var(--ink); font-family: var(--mono); font-size: .72rem; line-height: 1.7; padding: .65rem .8rem; resize: none; min-height: 72px; outline: none; transition: border-color .15s, box-shadow .15s; display: block; }
    .notes-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .notes-textarea::placeholder { color: var(--brown-light); opacity: .9; }
    .notes-footer { display: flex; justify-content: space-between; align-items: center; margin-top: .5rem; }
    .notes-status { font-family: var(--mono); font-size: .54rem; letter-spacing: .08em; color: var(--brown-mid); }
    .process-btn { font-family: var(--mono); font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); background: none; border: 1px solid var(--accent); padding: .32rem .8rem; cursor: pointer; transition: all .15s; opacity: 0; pointer-events: none; }
    .process-btn.visible { opacity: 1; pointer-events: auto; }
    .process-btn:hover { background: var(--accent-soft); }
    .notes-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0; transition: opacity .2s; flex-shrink: 0; }
    .notes-dot.has-notes { opacity: .85; }

    /* HOUSEHOLD SECTION */
    .household-section { border-top: 1px solid var(--line); }
    .section-header { display: flex; align-items: flex-end; justify-content: space-between; padding: 2.2rem 2.4rem 1rem; gap: 1.5rem; flex-wrap: wrap; }
    .section-header-left { display: flex; flex-direction: column; gap: .3rem; }
    .section-eyebrow { font-family: var(--mono); font-size: .58rem; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
    .section-title { font-family: var(--serif); font-size: 2rem; font-weight: 600; color: var(--ink); line-height: 1; letter-spacing: -.015em; }
    .section-title .em { font-style: italic; color: var(--accent); }

    .section-header-right { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
    .add-btn { font-family: var(--mono); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--paper); background: var(--accent); border: 1px solid var(--accent); padding: .55rem 1rem; cursor: pointer; transition: all .15s; }
    .add-btn:hover { background: var(--ink); border-color: var(--ink); }

    .sort-toggle { display: flex; gap: 0; border: 1px solid var(--line-hi); }
    .sort-btn { font-family: var(--mono); font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--brown-mid); background: var(--paper); border: none; padding: .5rem .9rem; cursor: pointer; transition: all .15s; }
    .sort-btn + .sort-btn { border-left: 1px solid var(--line-hi); }
    .sort-btn:hover { color: var(--accent); }
    .sort-btn.active { background: var(--accent); color: var(--paper); }

    /* MODAL */
    .modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal[hidden] { display: none; }
    .modal-bg { position: absolute; inset: 0; background: rgba(58,26,0,.45); backdrop-filter: blur(2px); }
    .modal-card { position: relative; background: var(--paper); border: 1px solid var(--line-hi); padding: 2rem; max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 24px 70px rgba(58,26,0,.18); }
    .modal-title { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; color: var(--ink); margin-bottom: 1.4rem; letter-spacing: -.01em; }
    .modal-title .em { font-style: italic; color: var(--accent); }
    .modal-row { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1rem; }
    .modal-label { font-family: var(--mono); font-size: .58rem; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
    .modal-row input[type="text"], .modal-row select, .modal-row textarea {
      background: var(--warm); border: 1px solid var(--line-hi); color: var(--ink); font-family: var(--sans); font-size: .85rem; padding: .55rem .7rem; outline: none; transition: border-color .15s, box-shadow .15s; width: 100%;
    }
    .modal-row textarea { font-family: var(--mono); font-size: .78rem; line-height: 1.6; resize: vertical; min-height: 70px; }
    .modal-row input:focus, .modal-row select:focus, .modal-row textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .modal-actions { display: flex; gap: .8rem; justify-content: flex-end; margin-top: 1.4rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }
    .modal-actions button { font-family: var(--mono); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; padding: .55rem 1.1rem; cursor: pointer; transition: all .15s; }
    .modal-cancel { color: var(--brown-mid); background: var(--paper); border: 1px solid var(--line-hi); }
    .modal-cancel:hover { color: var(--ink); border-color: var(--ink); }
    .modal-save { color: var(--paper); background: var(--accent); border: 1px solid var(--accent); }
    .modal-save:hover { background: var(--ink); border-color: var(--ink); }

    /* CARD ACTIONS (Edit / Delete on user-added cards) */
    .card-actions { display: flex; gap: .6rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }

    .card-action-btn.delete:hover { color: var(--paper); background: var(--urgent); border-color: var(--urgent); }
    .user-badge { font-family: var(--mono); font-size: .5rem; letter-spacing: .14em; text-transform: uppercase; color: var(--brown-light); background: var(--warm); padding: .15rem .4rem; margin-left: .5rem; }

    .household-grid-wrap { display: flex; flex-direction: column; gap: 1.2rem; }

    .sub-cat-divider { display: flex; align-items: center; gap: .8rem; padding: .9rem 0 .35rem; }

    .sub-cat-divider .rule { flex: 1; height: 1px; background: var(--line); }
    .sub-cat-divider .count { font-family: var(--mono); font-size: .56rem; color: var(--brown-mid); }

    /* COMPACT CHORE CARD */
    .card.chore { padding: .9rem 1.1rem; cursor: default; min-height: 0; }
    .card.chore:hover { background: var(--warm); }
    .card.chore .chore-row { display: flex; align-items: center; gap: .9rem; }
    .card.chore .chore-name { font-family: var(--serif); font-size: 1rem; font-weight: 600; color: var(--ink); flex: 1; line-height: 1.25; }
    .card.chore .status-badge { flex-shrink: 0; }
    .card.chore .done-btn { font-family: var(--mono); font-size: .56rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); background: var(--paper); border: 1px solid var(--accent); padding: .35rem .8rem; cursor: pointer; transition: all .15s; flex-shrink: 0; }
    .card.chore .done-btn:hover { background: var(--accent); color: var(--paper); }

    .card.chore.is-done .done-btn:hover { background: var(--shelved); }

    .shopping-item { display: flex; align-items: flex-start; gap: .55rem; cursor: pointer; padding: .25rem 0; }
    .shopping-item input[type="checkbox"] { margin-top: .2rem; flex-shrink: 0; accent-color: var(--accent); cursor: pointer; }
    .shopping-item span { font-size: .78rem; line-height: 1.45; color: var(--ink); flex: 1; }
    .shopping-item input:checked + span { text-decoration: line-through; color: var(--brown-light); }
    .shopping-add { display: flex; gap: .4rem; padding-top: .8rem; border-top: 1px solid var(--line); }
    .shopping-add input { flex: 1; background: var(--paper); border: 1px solid var(--line-hi); color: var(--ink); font-family: var(--sans); font-size: .76rem; padding: .45rem .55rem; outline: none; transition: border-color .15s; }

    .shopping-add button { font-family: var(--mono); font-size: .56rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); background: var(--paper); border: 1px solid var(--accent); padding: .35rem .7rem; cursor: pointer; transition: all .15s; }
    .shopping-add button:hover { background: var(--accent); color: var(--paper); }
    .shopping-clear { display: block; margin-top: .7rem; font-family: var(--mono); font-size: .54rem; letter-spacing: .14em; text-transform: uppercase; color: var(--brown-mid); background: none; border: none; cursor: pointer; padding: 0; transition: color .15s; }
    .shopping-clear:hover { color: var(--accent); }

    /* RESPONSIVE */
    @media (max-width: 1100px) {
      .household-body { grid-template-columns: 1fr; }

  const CUSTOM_KEY = 'sqrrl-dashboard-household-custom';
  function loadCustom() { try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); } catch { return []; } }
  function saveCustom() { localStorage.setItem(CUSTOM_KEY, JSON.stringify(HOUSEHOLD_CUSTOM)); }
  let HOUSEHOLD_CUSTOM = loadCustom();

  // Compute the effective household list: seeded + custom, with chore overrides applied
  function computeHousehold() {
    const all = [...HOUSEHOLD_RAW, ...HOUSEHOLD_CUSTOM];
    return all.map(p => {
      const overrideRaw = localStorage.getItem('chore_state_' + p.id);
      if (!overrideRaw) return p;
      try {
        const o = JSON.parse(overrideRaw);
        return { ...p, status: o.status || p.status, statusLabel: o.statusLabel || p.statusLabel, updated: o.updated || p.updated };
      } catch { return p; }
    });
  }
  let HOUSEHOLD = computeHousehold();

  function refreshHousehold() {
    HOUSEHOLD = computeHousehold();
    renderHouseholdSection();
  }

  // ─── BUILD STATUS BADGE ───────────────────────────────────────────────────
  function buildBadge(status, label, small) {
    const badge = el('span', (small ? 'sub-status ' : 'status-badge ') + status);
    const dot = el('span', 'dot');
    badge.appendChild(dot);
    badge.appendChild(document.createTextNode(label));
    return badge;
  }

  // ─── BUILD SUBPROJECT CARD ────────────────────────────────────────────────
  function buildSubCard(sub, delay) {
    const color = STATUS_COLORS[sub.status] || '#7a4520';
    const card = el('div', 'sub-card');
    card.style.cssText = '--sub-status-color:' + color + ';animation-delay:' + delay + 's';

    const top = el('div', 'sub-top');
    ap(top, el('span', 'sub-label', sub.category), buildBadge(sub.status, sub.statusLabel, true));

    const name = el('div', 'sub-name', sub.name);
    const summary = el('div', 'sub-summary', sub.summary);

    const expandRow = el('div', 'sub-expand');
    const expandIcon = el('span', 'sub-expand-icon', '▼');
    expandRow.appendChild(expandIcon);

    const details = el('div', 'sub-details');
    const inner = el('div', 'sub-details-inner');
    if (sub.steps && sub.steps.length) {
      const lbl = el('div', 'details-section-label', 'Steps');
      lbl.style.marginTop = '0';
      const list = el('ul', 'sub-steps');
      sub.steps.forEach(s => list.appendChild(el('li', '', s)));
      ap(inner, lbl, list);
    }
    details.appendChild(inner);

    ap(card, top, name, summary, expandRow, details);

    card.addEventListener('click', e => {
      e.stopPropagation();
      card.classList.toggle('open');
    });
    return card;
  }

  // ─── BUILD COMPACT CHORE CARD ─────────────────────────────────────────────
  function buildChoreCard(p, index) {
    const color = STATUS_COLORS[p.status] || '#7a4520';
    const card = el('div', 'card chore');
    card.style.cssText = '--status-color:' + color + ';animation-delay:' + (index * 0.05) + 's';
    const isDone = p.status === 'shelved';
    if (isDone) card.classList.add('is-done');

    const row = el('div', 'chore-row');
    const name = el('div', 'chore-name', p.name);
    const badge = buildBadge(p.status, p.statusLabel, false);
    const btn = el('button', 'done-btn', isDone ? 'Done ✓' : 'Done');

    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (card.classList.contains('is-done')) return;
      const today = new Date().toISOString().slice(0, 10);
      localStorage.setItem('chore_state_' + p.id, JSON.stringify({ status: 'shelved', statusLabel: 'DONE', updated: today }));
      p.status = 'shelved'; p.statusLabel = 'DONE'; p.updated = today;
      renderHouseholdSection();
    });

    ap(row, name, badge, btn);
    card.appendChild(row);
    return card;
  }

    const nStatus = el('span', 'notes-status', textarea.value.trim() ? textarea.value.length + ' chars' : '');
    const processBtn = el('button', 'process-btn', 'Process');
    if (textarea.value.trim()) processBtn.classList.add('visible');

    let debounce;
    textarea.addEventListener('input', () => {
      clearTimeout(debounce);
      const val = textarea.value;
      notesDot.classList.toggle('has-notes', val.trim().length > 0);
      processBtn.classList.toggle('visible', val.trim().length > 0);
      nStatus.textContent = val.length ? val.length + ' chars' : '';
      debounce = setTimeout(() => {
        localStorage.setItem('notes_' + p.id, val);
        nStatus.textContent = (val.length ? val.length + ' chars · ' : '') + 'saved';
      }, 800);
    });

    processBtn.addEventListener('click', () => {
      const all = [...PROJECTS, ...HOUSEHOLD];
      const lines = all.map(proj => {
        const n = (localStorage.getItem('notes_' + proj.id) || '').trim();
        return n ? '[' + proj.name + ']\n' + n : null;
      }).filter(Boolean);
      if (!lines.length) return;
      const text = lines.join('\n\n');
      navigator.clipboard.writeText(text).then(() => {
        processBtn.textContent = 'Copied ✓';
        setTimeout(() => { processBtn.textContent = 'Process'; }, 2200);
      }).catch(() => { prompt('Copy to send to Tink:', text); });
    });

    ap(nFooter, nStatus, processBtn);
    ap(notesSec, notesLbl, textarea, nFooter);
    inner.appendChild(notesSec);

    if (p.userAdded) {
      const actionsRow = el('div', 'card-actions');
      const editBtn = el('button', 'card-action-btn', 'Edit');
      const delBtn  = el('button', 'card-action-btn delete', 'Delete');
      editBtn.addEventListener('click', e => { e.stopPropagation(); openProjectModal('edit', p); });
      delBtn.addEventListener('click', e => { e.stopPropagation(); deleteProject(p.id); });
      ap(actionsRow, editBtn, delBtn);
      inner.appendChild(actionsRow);
    }

    details.appendChild(inner);
    ap(card, top, name, summary, footer, details);

    card.addEventListener('click', e => {
      if (e.target.closest('.notes-section')) return;
      const isOpen = card.classList.contains('open');
      const grid = card.parentElement;
      grid.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));
      if (!isOpen) card.classList.add('open');
    });

    return card;
  }

  // ─── RENDER SUMMARY VIEW (work-only) ──────────────────────────────────────
  function renderSummary() {
    const container = document.getElementById('summary-view');
    clear(container);
    const total = PROJECTS.length;
    const counts = {};
    STATUS_ORDER.forEach(s => counts[s] = 0);
    PROJECTS.forEach(p => { counts[p.status] = (counts[p.status] || 0) + 1; });

    const donutPanel = el('div', 'summary-donut-panel');
    const donutWrap  = el('div', 'donut-wrap');
    const donutRing  = el('div', 'donut-ring');
    const donutHole  = el('div', 'donut-hole');
    const donutCtr   = el('div', 'donut-center');
    ap(donutCtr, el('div', 'donut-total', String(total)), el('div', 'donut-label', 'Projects'));

    const segments = [];
    let angle = 0;
    STATUS_ORDER.forEach(s => {
      const c = counts[s] || 0;
      if (!c) return;
      const deg = (c / total) * 360;
      segments.push(STATUS_COLORS[s] + ' ' + angle.toFixed(1) + 'deg ' + (angle + deg).toFixed(1) + 'deg');
      angle += deg;
    });
    donutRing.style.background = 'conic-gradient(' + segments.join(',') + ')';
    ap(donutWrap, donutRing, donutHole, donutCtr);

    const legend = el('div', 'donut-legend');
    STATUS_ORDER.forEach(s => {
      const c = counts[s] || 0;
      if (!c) return;
      const row = el('div', 'legend-row');
      const dot = el('span', 'legend-dot');
      dot.style.background = STATUS_COLORS[s];
      ap(row, dot, el('span', '', STATUS_LABELS[s]), el('span', 'legend-val', String(c)));
      legend.appendChild(row);
    });
    ap(donutPanel, donutWrap, legend);

    const rightPanel = el('div', 'summary-right');
    const moving = (counts.active || 0) + (counts.indev || 0);
    const stuck  = (counts.urgent || 0) + (counts.blocked || 0);
    const health = (moving + stuck) > 0 ? Math.round(moving / (moving + stuck) * 100) : 100;
    const hClass = health >= 67 ? 'health-score hi' : health >= 40 ? 'health-score mid' : 'health-score lo';

    const topRow = el('div', 'summary-top-row');
    const hBlock = el('div', 'health-block');
    ap(hBlock,
      el('div', hClass, health + '%'),
      el('div', 'health-label', 'Momentum'),
      el('div', 'health-sub', moving + ' moving · ' + stuck + ' stuck · ' + (total - moving - stuck) + ' pending')
    );
    topRow.appendChild(hBlock);

    const actSection = el('div', 'activity-section');
    actSection.appendChild(el('div', 'activity-label', 'Last Touched'));
    const barsWrap = el('div', 'activity-bars');
    const today = new Date();
    const sorted = [...PROJECTS].sort((a,b) => STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status));
    sorted.forEach(p => {
      const days = Math.floor((today - new Date(p.updated)) / 86400000);
      const pct  = Math.max(6, Math.min(100, 100 - (days / 14) * 100));
      const color = STATUS_COLORS[p.status] || '#7a4520';
      const row   = el('div', 'activity-row');
      const track = el('div', 'activity-bar-track');
      const fill  = el('div', 'activity-bar-fill');
      fill.style.cssText = 'width:' + pct.toFixed(0) + '%;background:' + color + ';opacity:' + (days <= 1 ? '1' : '.6');
      track.appendChild(fill);
      ap(row, el('div', 'activity-name', p.name), track, el('div', 'activity-days', days === 0 ? 'today' : days + 'd'));
      barsWrap.appendChild(row);
    });
    actSection.appendChild(barsWrap);
    topRow.appendChild(actSection);
    rightPanel.appendChild(topRow);

    ap(container, donutPanel, rightPanel);
  }

  // ─── RENDER STATS BAR (parameterized) ─────────────────────────────────────
  function renderStats(targetId, projects, opts) {
    opts = opts || {};
    const counts = {};
    projects.forEach(p => counts[p.status] = (counts[p.status] || 0) + 1);
    const order = ['urgent','blocked','active','indev','concept','todo'];
    const bar = document.getElementById(targetId);
    clear(bar);

    order.filter(k => counts[k]).forEach(k => {
      const block = el('div', 'stat-block');
      const dot   = el('div', 'stat-dot ' + k);
      const count = el('span', 'stat-count', String(counts[k]));
      const lbl   = el('span', 'stat-label', STATUS_LABELS[k]);
      ap(block, dot, count, lbl);
      bar.appendChild(block);
    });

    if (opts.tools !== false) {
      const tools = el('div', 'tools-quick');
      [['Crucible','/crucible.html'],['Billing','/sqrrlbrain-billing.html']].forEach(([name, href]) => {
        const a = el('a', 'tool-link', name);
        a.href = href;
        tools.appendChild(a);
      });
      bar.appendChild(tools);
    }
  }

  // ─── RENDER GRID (parameterized, with optional grouping + sort) ──────────
  function renderGrid(targetId, projects, opts) {
    opts = opts || {};
    const target = document.getElementById(targetId);
    clear(target);

    if (opts.groupBy === 'subCategory') {
      const groups = {};
      projects.forEach(p => {
        const k = p.subCategory || 'Other';
        (groups[k] = groups[k] || []).push(p);
      });
      const ordered = SUBCATEGORY_ORDER.filter(k => groups[k]);
      Object.keys(groups).forEach(k => { if (!ordered.includes(k)) ordered.push(k); });

      let cardIdx = 0;
      ordered.forEach(k => {
        const items = [...groups[k]].sort((a, b) =>
          STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status)
        );

        const divider = el('div', 'sub-cat-divider');
        ap(divider,
          el('span', 'label', k),
          el('span', 'rule'),
          el('span', 'count', items.length + (items.length === 1 ? ' item' : ' items'))
        );
        target.appendChild(divider);

        const grid = el('div', 'projects-grid');
        items.forEach(p => grid.appendChild(buildCard(p, cardIdx++)));
        target.appendChild(grid);
      });
    } else {
      const sorted = [...projects].sort((a, b) => {
        if (opts.sortBy === 'recent') return new Date(b.updated) - new Date(a.updated);
        return STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
      });
      const grid = el('div', 'projects-grid');
      sorted.forEach((p, i) => grid.appendChild(buildCard(p, i)));
      target.appendChild(grid);
    }
  }

  // ─── SHOPPING LIST ────────────────────────────────────────────────────────
  function loadShopping() {
    try {
      const raw = localStorage.getItem(SHOPPING_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}
    return [...SHOPPING_DEFAULT];
  }
  function saveShopping(items) { localStorage.setItem(SHOPPING_KEY, JSON.stringify(items)); }

  function renderShopping(targetId) {
    const target = document.getElementById(targetId);
    clear(target);
    let items = loadShopping();

    const header = el('div', 'shopping-header', 'Shopping List');
    const itemsWrap = el('div', 'shopping-items');

    function rerender() {
      clear(itemsWrap);
      items.forEach((it, i) => {
        const label = el('label', 'shopping-item');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!it.done;
        cb.addEventListener('change', () => {
          items[i] = { ...items[i], done: cb.checked };
          saveShopping(items);
          rerender();
        });
        const span = el('span', '', it.text);
        label.appendChild(cb);
        label.appendChild(span);
        itemsWrap.appendChild(label);
      });
    }
    rerender();

    const addRow = el('div', 'shopping-add');
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Add item…';
    const addBtn = el('button', '', '+ Add');
    function addItem() {
      const text = input.value.trim();
      if (!text) return;
      items.push({ text, done: false });
      saveShopping(items);
      input.value = '';
      rerender();
    }
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
    addBtn.addEventListener('click', addItem);
    addRow.appendChild(input);
    addRow.appendChild(addBtn);

    const clearBtn = el('button', 'shopping-clear', 'Clear checked');
    clearBtn.addEventListener('click', () => {
      items = items.filter(i => !i.done);
      saveShopping(items);
      rerender();
    });

    ap(target, header, itemsWrap, addRow, clearBtn);
  }

  // ─── HOUSEHOLD ORCHESTRATOR + SORT TOGGLE ────────────────────────────────
  let householdSortMode = 'category';

  function renderHouseholdSection() {
    renderStats('household-stats', HOUSEHOLD, { tools: false });
    renderGrid('household-grid', HOUSEHOLD, householdSortMode === 'recent'
      ? { sortBy: 'recent' }
      : { groupBy: 'subCategory', sortBy: 'category' });
  }

  function wireSortToggle() {
    const wrap = document.getElementById('household-sort');
    if (!wrap) return;
    wrap.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        wrap.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        householdSortMode = btn.dataset.sort;
        renderHouseholdSection();
      });
    });
  }

  // ─── PROJECT MODAL (Add / Edit / Delete on user-added cards) ─────────────
  function openProjectModal(mode, project) {
    const modal = document.getElementById('project-modal');
    const title = document.getElementById('modal-title');
    clear(title);
    title.appendChild(document.createTextNode(mode === 'create' ? 'Add ' : 'Edit '));
    const em = el('span', 'em', 'Project');
    title.appendChild(em);
    document.getElementById('m-name').value    = project ? project.name : '';
    document.getElementById('m-subcat').value  = project ? project.subCategory : 'Woodworking';
    document.getElementById('m-status').value  = project ? project.status : 'todo';
    document.getElementById('m-summary').value = project ? (project.summary || '') : '';
    document.getElementById('m-steps').value   = project && project.steps ? project.steps.join('\n') : '';
    modal.dataset.mode   = mode;
    modal.dataset.editId = project ? project.id : '';
    modal.hidden = false;
    setTimeout(() => document.getElementById('m-name').focus(), 50);
  }
  function closeProjectModal() {
    document.getElementById('project-modal').hidden = true;
  }
  function saveProjectModal() {
    const modal = document.getElementById('project-modal');
    const mode    = modal.dataset.mode;
    const editId  = modal.dataset.editId;
    const name    = document.getElementById('m-name').value.trim();
    if (!name) { document.getElementById('m-name').focus(); return; }
    const subCategory = document.getElementById('m-subcat').value;
    const status      = document.getElementById('m-status').value;
    const statusLabel = (STATUS_LABELS[status] || status).toUpperCase();
    const summary     = document.getElementById('m-summary').value.trim();
    const stepsText   = document.getElementById('m-steps').value;
    const steps       = stepsText.split('\n').map(s => s.trim()).filter(Boolean);
    const today       = new Date().toISOString().slice(0, 10);

    if (mode === 'create') {
      const id = 'h-custom-' + Date.now();
      HOUSEHOLD_CUSTOM.push({
        id, name, category: subCategory, subCategory,
        status, statusLabel, summary, steps, blockers: [],
        updated: today, userAdded: true
      });
    } else {
      const idx = HOUSEHOLD_CUSTOM.findIndex(p => p.id === editId);
      if (idx >= 0) {
        HOUSEHOLD_CUSTOM[idx] = {
          ...HOUSEHOLD_CUSTOM[idx],
          name, category: subCategory, subCategory,
          status, statusLabel, summary, steps, updated: today
        };
      }
    }
    saveCustom();
    closeProjectModal();
    refreshHousehold();
  }
  function deleteProject(id) {
    const target = HOUSEHOLD_CUSTOM.find(p => p.id === id);
    if (!target) return;
    if (!confirm('Delete "' + target.name + '"? This cannot be undone.')) return;
    HOUSEHOLD_CUSTOM = HOUSEHOLD_CUSTOM.filter(p => p.id !== id);
    saveCustom();
    // Also clear any notes the user wrote on this project
    localStorage.removeItem('notes_' + id);
    refreshHousehold();
  }
  function wireProjectModal() {
    const addBtn = document.getElementById('household-add-btn');
    if (addBtn) addBtn.addEventListener('click', () => openProjectModal('create', null));
    document.getElementById('m-cancel').addEventListener('click', closeProjectModal);
    document.getElementById('modal-bg').addEventListener('click', closeProjectModal);
    document.getElementById('m-save').addEventListener('click', saveProjectModal);
    document.addEventListener('keydown', e => {
      const modal = document.getElementById('project-modal');
      if (modal.hidden) return;
      if (e.key === 'Escape') closeProjectModal();
      if (e.key === 'Enter' && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) saveProjectModal();
    });
  }

  // ─── LIVE CLOCK ───────────────────────────────────────────────────────────
  function updateClock() {
    const now = new Date();
    document.getElementById('clock-date').textContent =
      now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}).toUpperCase();
    document.getElementById('clock-time').textContent =
      now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ─── FIRESTORE SYNC (cross-device) ────────────────────────────────────────
  // Pull-on-load + push-on-change. Single doc per user at dashboard_state/<email>.
  // Sets up after auth confirms; re-pulls when the tab regains focus.
  const SYNC_DEBOUNCE_MS = 1500;
  const SYNC_LS_PREFIX_RE = /^(notes_|chore_state_)/;
  const SYNC_LS_KEYS = new Set([CUSTOM_KEY, SHOPPING_KEY]);
  function isSyncedKey(k) { return SYNC_LS_PREFIX_RE.test(k) || SYNC_LS_KEYS.has(k); }

  // Capture originals before monkey-patching so internal sync writes don't recurse
  const _origSet    = localStorage.setItem.bind(localStorage);
  const _origRemove = localStorage.removeItem.bind(localStorage);
  let _syncDoc = null;
  let _syncDebounce = null;
  let _syncReady = false;       // true after first successful pull; gates push
  let _syncSuppress = false;    // true while applyRemoteState is writing

  function gatherLocalState() {
    const notes = {};
    const chores = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith('notes_')) notes[k.slice(6)] = localStorage.getItem(k);
      else if (k.startsWith('chore_state_')) {
        try { chores[k.slice(12)] = JSON.parse(localStorage.getItem(k)); } catch {}
      }
    }
    let household_custom = [];
    try { household_custom = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); } catch {}
    let shopping = [];
    try { shopping = JSON.parse(localStorage.getItem(SHOPPING_KEY) || '[]'); } catch {}
    return { notes, chores, household_custom, shopping };
  }

  function applyRemoteState(data) {
    if (!data) return;
    _syncSuppress = true;
    try {
      // Clear existing synced keys so removed items propagate
      const toRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (isSyncedKey(k)) toRemove.push(k);
      }
      toRemove.forEach(k => _origRemove(k));

      if (data.notes) Object.entries(data.notes).forEach(([id, val]) => _origSet('notes_' + id, val));
      if (data.chores) Object.entries(data.chores).forEach(([id, val]) => _origSet('chore_state_' + id, JSON.stringify(val)));
      if (data.household_custom) _origSet(CUSTOM_KEY, JSON.stringify(data.household_custom));
      if (data.shopping) _origSet(SHOPPING_KEY, JSON.stringify(data.shopping));
    } finally {
      _syncSuppress = false;
    }
  }

  async function pullState() {
    if (!_syncDoc) return;
    try {
      const snap = await _syncDoc.get();
      if (snap.exists) applyRemoteState(snap.data());
      _syncReady = true;
      // Refresh derived in-memory state and re-render
      HOUSEHOLD_CUSTOM = loadCustom();
      refreshHousehold();
      renderShopping('shopping-list');
      renderGrid('projects-grid', PROJECTS, {});
    } catch (e) {
      console.warn('Dashboard sync pull failed:', e && e.message);
    }
  }

  function pushState() {
    if (!_syncDoc || !_syncReady || _syncSuppress) return;
    clearTimeout(_syncDebounce);
    _syncDebounce = setTimeout(async () => {
      try {
        const data = gatherLocalState();
        data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
        await _syncDoc.set(data);
      } catch (e) {
        console.warn('Dashboard sync push failed:', e && e.message);
      }
    }, SYNC_DEBOUNCE_MS);
  }

  // Monkey-patch localStorage write paths so any code that touches a synced key
  // automatically queues a Firestore push. Non-synced keys are unaffected.
  localStorage.setItem = (k, v) => {
    _origSet(k, v);
    if (isSyncedKey(k)) pushState();
  };
  localStorage.removeItem = (k) => {
    _origRemove(k);
    if (isSyncedKey(k)) pushState();
  };

  function initSync() {
    if (typeof firebase === 'undefined' || !firebase.firestore) return;
    if (!firebase.apps || !firebase.apps.length) {
      // Auth path didn't initialize Firebase — bail rather than throw
      console.warn('Dashboard sync: Firebase app not initialized; skipping');
      return;
    }
    firebase.auth().onAuthStateChanged(async user => {
      if (!user || !user.email) {
        _syncDoc = null;
        _syncReady = false;
        return;
      }
      const ref = firebase.firestore().collection('dashboard_state').doc(user.email);
      if (_syncDoc && _syncDoc.path === ref.path) return;
      _syncDoc = ref;
      _syncReady = false;
      await pullState();
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && _syncDoc) pullState();
    });
  }

  // ─── BOOT ─────────────────────────────────────────────────────────────────
  renderStats('stats-bar', PROJECTS, { tools: true });
  renderSummary();
  renderGrid('projects-grid', PROJECTS, {});
  renderHouseholdSection();
  renderShopping('shopping-list');
  wireSortToggle();
  wireProjectModal();
  SqrrlAuth.check();
  initSync();
  </script>
</body>
