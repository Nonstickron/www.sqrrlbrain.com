<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crucible — Audit</title>
  <link rel="icon" type="image/svg+xml" href="images/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #090805;
      --surface: #131009;
      --border:  rgba(196,153,58,.15);
      --gold:    #c4993a;
      --gold-dim:#8a6a25;
      --text:    #e8dfc8;
      --muted:   #7a6e58;
      --red:     #c45a3a;
      --green:   #5a9a6a;
      --mono:    'DM Mono', monospace;
      --serif:   'Cormorant Garamond', serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 1.5rem;
      padding: .75rem 1.5rem;
    }
    .logo { font-family: var(--serif); font-size: 1.3rem; color: var(--gold); letter-spacing: .02em; white-space: nowrap; }
    .logo span { color: var(--muted); font-size: .75rem; font-family: var(--mono); font-style: normal; margin-left: .5rem; }

    .controls { display: flex; gap: .6rem; flex: 1; align-items: center; flex-wrap: wrap; }

    input[type="text"], select {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: var(--mono); font-size: .72rem;
      padding: .4rem .7rem; outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: var(--gold-dim); }
    #search { flex: 1; min-width: 180px; }
    select { min-width: 130px; }
    select option { background: #1a1408; }

    .stat { font-size: .65rem; color: var(--muted); white-space: nowrap; }
    .stat strong { color: var(--gold); }

    .btn {
      font-family: var(--mono); font-size: .65rem; letter-spacing: .1em;
      text-transform: uppercase; padding: .4rem 1rem;
      border: 1px solid var(--gold-dim); background: transparent;
      color: var(--gold); cursor: pointer; white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .btn:hover { background: var(--gold); color: var(--bg); }
    .btn.primary { background: var(--gold); color: var(--bg); border-color: var(--gold); }
    .btn.primary:hover { background: var(--gold-dim); border-color: var(--gold-dim); }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: var(--red); color: #fff; }
    .btn:disabled { opacity: .35; cursor: default; }

    #change-badge {
      font-size: .65rem; background: var(--gold); color: var(--bg);
      padding: .1rem .45rem; border-radius: 99px; display: none;
    }

    #list { padding: .75rem 1.5rem 4rem; }

    .recipe-row {
      border: 1px solid var(--border); margin-bottom: 3px;
      background: var(--surface);
    }
    .recipe-row.changed { border-color: rgba(196,153,58,.5); }
    .recipe-row.deleted { opacity: .4; border-color: var(--red); }

    .row-head {
      display: grid;
      grid-template-columns: 2fr 90px 60px 60px 40px;
      align-items: center; gap: .5rem;
      padding: .55rem .9rem; cursor: pointer; user-select: none;
    }
    .row-head:hover { background: rgba(196,153,58,.04); }

    .recipe-name { font-family: var(--serif); font-size: 1rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recipe-name.renamed { color: var(--gold); }
    .cat-badge { font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; }
    .sum-badge { font-size: .68rem; text-align: right; }
    .sum-ok { color: var(--green); }
    .sum-warn { color: #c49a3a; }
    .sum-bad { color: var(--red); }
    .ing-count { font-size: .65rem; color: var(--muted); text-align: right; }
    .expand-icon { color: var(--muted); font-size: .7rem; text-align: right; transition: transform .15s; }
    .recipe-row.open .expand-icon { transform: rotate(90deg); }

    .editor {
      display: none; padding: .9rem 1.2rem 1.2rem;
      border-top: 1px solid var(--border); background: #0e0c07;
    }
    .recipe-row.open .editor { display: block; }

    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; margin-bottom: 1rem; }
    @media (max-width: 680px) { .editor-grid { grid-template-columns: 1fr; } }

    .field label { display: block; font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: .3rem; }
    .field input[type="text"], .field select, .field textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: var(--mono); font-size: .75rem;
      padding: .4rem .6rem; outline: none; resize: vertical;
    }
    .field input[type="text"]:focus, .field select:focus, .field textarea:focus { border-color: var(--gold-dim); }
    .field textarea { min-height: 60px; }
    .field.full { grid-column: 1 / -1; }

    .ing-label { font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: .4rem; }
    .ing-table { width: 100%; border-collapse: collapse; margin-bottom: .6rem; }
    .ing-table th { font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; padding: .2rem .4rem; border-bottom: 1px solid var(--border); }
    .ing-table td { padding: .25rem .3rem; vertical-align: middle; }
    .ing-table input[type="text"] { width: 100%; background: var(--bg); border: 1px solid transparent; color: var(--text); font-family: var(--mono); font-size: .75rem; padding: .2rem .4rem; }
    .ing-table input[type="text"]:focus { border-color: var(--gold-dim); outline: none; }
    .ing-table input[type="number"] { width: 68px; background: var(--bg); border: 1px solid transparent; color: var(--text); font-family: var(--mono); font-size: .75rem; padding: .2rem .4rem; text-align: right; }
    .ing-table input[type="number"]:focus { border-color: var(--gold-dim); outline: none; }
    .ing-table .del-ing { background: none; border: none; color: var(--red); cursor: pointer; font-size: .8rem; padding: .1rem .3rem; opacity: .5; }
    .ing-table .del-ing:hover { opacity: 1; }
    .ing-table tr.ing-row:hover td { background: rgba(196,153,58,.03); }

    .ing-actions { display: flex; gap: .5rem; margin-bottom: 1rem; align-items: center; }
    .ing-actions .sum-live { font-size: .68rem; margin-left: auto; }

    .editor-actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .8rem; padding-top: .8rem; border-top: 1px solid var(--border); }

    .uuid-chip { font-size: .58rem; color: var(--muted); letter-spacing: .05em; margin-top: .4rem; font-family: var(--mono); }

    #empty { display: none; text-align: center; padding: 4rem; color: var(--muted); font-size: .8rem; }

    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: var(--surface); border: 1px solid var(--gold-dim);
      color: var(--gold); font-size: .68rem; letter-spacing: .08em;
      padding: .6rem 1.2rem; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 999;
    }
    #toast.show { opacity: 1; }

    #sqrrl-gate {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; font-size: .75rem; color: var(--muted); letter-spacing: .1em;
    }
  </style>
</head>
<body>

<div id="sqrrl-gate">Verifying access&hellip;</div>

<header>
  <div class="logo">Crucible <span>Audit</span></div>
  <div class="controls">
    <input type="text" id="search" placeholder="Search name or ingredient…" />
    <select id="cat-filter">
      <option value="">All categories</option>
      <option value="body">Body</option>
      <option value="cleaning">Cleaning</option>
      <option value="face">Face</option>
      <option value="hair">Hair</option>
      <option value="makeup">Makeup</option>
      <option value="simple">Simple</option>
      <option value="soap">Soap</option>
      <option value="super-simple">Super-simple</option>
    </select>
    <select id="sort-by">
      <option value="name">Sort: Name</option>
      <option value="category">Sort: Category</option>
      <option value="sum">Sort: Sum %</option>
      <option value="count">Sort: Ingredient count</option>
    </select>
    <span class="stat">Showing <strong id="showing-count">0</strong> / <strong id="total-count">0</strong></span>
    <span id="change-badge">0 changes</span>
    <button class="btn primary" id="export-btn" disabled>Export JSON</button>
  </div>
</header>

<div id="list"></div>
<div id="empty">No recipes match your filters.</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script>SqrrlAuth.check();</script>
<script>
'use strict';

// ── state ─────────────────────────────────────────────────────────────────────
let ALL = [];
let STORE = null;
let changeCount = 0;
let toastTimer;

// ── helpers ───────────────────────────────────────────────────────────────────
function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}
function ap(parent) {
  for (let i = 1; i < arguments.length; i++) parent.appendChild(arguments[i]);
  return parent;
}
function clearChildren(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

function ingSum(ings) {
  return ings.reduce((s, i) => s + (parseFloat(i.pct) || 0), 0);
}
function sumClass(s) {
  if (Math.abs(s - 100) <= 0.5) return 'sum-ok';
  if (Math.abs(s - 100) <= 5)  return 'sum-warn';
  return 'sum-bad';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

function markChanged(row) {
  if (!row.classList.contains('changed')) {
    row.classList.add('changed');
    changeCount++;
    updateBadge();
  }
}
function updateBadge() {
  const b = document.getElementById('change-badge');
  b.style.display = changeCount > 0 ? 'inline' : 'none';
  b.textContent = changeCount + (changeCount === 1 ? ' change' : ' changes');
  document.getElementById('export-btn').disabled = changeCount === 0;
}

// ── load ──────────────────────────────────────────────────────────────────────
fetch('formulator-data.json')
  .then(r => r.json())
  .then(store => {
    STORE = store;
    ALL   = store.recipes;
    document.getElementById('total-count').textContent = ALL.length;
    applyFilters();
  });

// ── ingredient table ──────────────────────────────────────────────────────────
function buildIngTable(recipe, row) {
  const wrap  = el('div');
  const label = el('div', 'ing-label');
  label.textContent = 'Ingredients';

  const table = el('table', 'ing-table');
  const thead = el('thead');
  const hr    = el('tr');
  ['Ingredient', '%', ''].forEach(h => {
    const th = el('th');
    th.textContent = h;
    hr.appendChild(th);
  });
  ap(thead, hr);
  const tbody = el('tbody');
  ap(table, thead, tbody);

  const sumEl = el('span', 'sum-live');

  function refreshSum() {
    const s = ingSum(recipe.ingredients);
    sumEl.textContent = 'Sum: ' + s.toFixed(2) + '%';
    sumEl.className = 'sum-live ' + sumClass(s);
    const badge = row.querySelector('.sum-badge');
    if (badge) {
      badge.textContent = s.toFixed(1) + '%';
      badge.className = 'sum-badge ' + sumClass(s);
    }
  }

  function buildIngRow(ing, idx) {
    const tr = el('tr', 'ing-row');

    const nameIn = el('input');
    nameIn.type  = 'text';
    nameIn.value = ing.name;
    nameIn.addEventListener('input', () => {
      recipe.ingredients[idx].name = nameIn.value;
      markChanged(row);
    });

    const pctIn   = el('input');
    pctIn.type    = 'number';
    pctIn.step    = '0.01';
    pctIn.value   = ing.pct;
    pctIn.addEventListener('input', () => {
      recipe.ingredients[idx].pct = parseFloat(pctIn.value) || 0;
      refreshSum();
      markChanged(row);
    });

    const delBtn = el('button', 'del-ing');
    delBtn.type  = 'button';
    delBtn.textContent = '✕';
    delBtn.title = 'Remove ingredient';
    delBtn.addEventListener('click', () => {
      recipe.ingredients.splice(idx, 1);
      rebuildRows();
      refreshSum();
      markChanged(row);
    });

    const tdName = el('td'); ap(tdName, nameIn);
    const tdPct  = el('td'); ap(tdPct,  pctIn);
    const tdDel  = el('td'); ap(tdDel,  delBtn);
    ap(tr, tdName, tdPct, tdDel);
    return tr;
  }

  function rebuildRows() {
    clearChildren(tbody);
    recipe.ingredients.forEach((ing, i) => tbody.appendChild(buildIngRow(ing, i)));
  }

  rebuildRows();

  const addBtn = el('button', 'btn');
  addBtn.type = 'button';
  addBtn.textContent = '+ Add ingredient';
  addBtn.addEventListener('click', () => {
    recipe.ingredients.push({ name: '', pct: 0 });
    rebuildRows();
    refreshSum();
    markChanged(row);
    const inputs = tbody.querySelectorAll('input[type="text"]');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  const normBtn = el('button', 'btn');
  normBtn.type  = 'button';
  normBtn.textContent = 'Normalize to 100%';
  normBtn.addEventListener('click', () => {
    const s = ingSum(recipe.ingredients);
    if (!s) return;
    recipe.ingredients.forEach(ing => {
      ing.pct = Math.round((ing.pct / s) * 10000) / 100;
    });
    rebuildRows();
    refreshSum();
    markChanged(row);
    toast('Normalized to 100%');
  });

  const actions = el('div', 'ing-actions');
  ap(actions, addBtn, normBtn, sumEl);

  ap(wrap, label, table, actions);
  refreshSum();
  return wrap;
}

// ── recipe row ────────────────────────────────────────────────────────────────
function buildRow(recipe) {
  const row = el('div', 'recipe-row');
  row.dataset.uuid = recipe.uuid || '';

  // head
  const head     = el('div', 'row-head');
  const nameEl   = el('span', 'recipe-name');
  nameEl.textContent = recipe.name;

  const catEl    = el('span', 'cat-badge');
  catEl.textContent = recipe.category || '—';

  const s        = ingSum(recipe.ingredients);
  const sumBadge = el('span', 'sum-badge ' + sumClass(s));
  sumBadge.textContent = s.toFixed(1) + '%';

  const cntEl    = el('span', 'ing-count');
  cntEl.textContent = recipe.ingredients.length + ' ing';

  const icon     = el('span', 'expand-icon');
  icon.textContent = '▶';

  ap(head, nameEl, catEl, sumBadge, cntEl, icon);
  row.appendChild(head);

  // editor
  const editor = el('div', 'editor');
  const grid   = el('div', 'editor-grid');

  // name
  const nameField = el('div', 'field');
  const nameLbl   = el('label'); nameLbl.textContent = 'Name';
  const nameIn    = el('input'); nameIn.type = 'text'; nameIn.value = recipe.name;
  nameIn.addEventListener('input', () => {
    recipe.name = nameIn.value;
    nameEl.textContent = nameIn.value;
    nameEl.classList.add('renamed');
    markChanged(row);
  });
  ap(nameField, nameLbl, nameIn);
  grid.appendChild(nameField);

  // category
  const catField = el('div', 'field');
  const catLbl   = el('label'); catLbl.textContent = 'Category';
  const catSel   = el('select');
  ['body','cleaning','face','hair','makeup','simple','soap','super-simple'].forEach(c => {
    const opt = el('option'); opt.value = c; opt.textContent = c;
    if (recipe.category === c) opt.selected = true;
    catSel.appendChild(opt);
  });
  catSel.addEventListener('change', () => {
    recipe.category = catSel.value;
    catEl.textContent = catSel.value;
    markChanged(row);
  });
  ap(catField, catLbl, catSel);
  grid.appendChild(catField);

  // heat
  const heatField = el('div', 'field');
  const heatLbl   = el('label'); heatLbl.textContent = 'Heat required';
  const heatSel   = el('select');
  [['false','No'],['true','Yes']].forEach(([v,t]) => {
    const opt = el('option'); opt.value = v; opt.textContent = t;
    if (String(recipe.heatRequired) === v) opt.selected = true;
    heatSel.appendChild(opt);
  });
  heatSel.addEventListener('change', () => {
    recipe.heatRequired = heatSel.value === 'true';
    markChanged(row);
  });
  ap(heatField, heatLbl, heatSel);
  grid.appendChild(heatField);

  // description
  const descField = el('div', 'field full');
  const descLbl   = el('label'); descLbl.textContent = 'Description';
  const descTA    = el('textarea'); descTA.value = recipe.description || '';
  descTA.addEventListener('input', () => { recipe.description = descTA.value; markChanged(row); });
  ap(descField, descLbl, descTA);
  grid.appendChild(descField);

  // notes
  const notesField = el('div', 'field full');
  const notesLbl   = el('label'); notesLbl.textContent = 'Notes';
  const notesTA    = el('textarea'); notesTA.value = recipe.notes || '';
  notesTA.addEventListener('input', () => { recipe.notes = notesTA.value; markChanged(row); });
  ap(notesField, notesLbl, notesTA);
  grid.appendChild(notesField);

  editor.appendChild(grid);
  editor.appendChild(buildIngTable(recipe, row));

  // uuid chip
  const chip = el('div', 'uuid-chip');
  chip.textContent = 'uuid: ' + (recipe.uuid || '—') + '  ·  id: ' + (recipe.id || '—');
  editor.appendChild(chip);

  // actions
  const acts   = el('div', 'editor-actions');
  const saveBtn = el('button', 'btn primary');
  saveBtn.type = 'button';
  saveBtn.textContent = 'Save changes';
  saveBtn.addEventListener('click', () => {
    markChanged(row);
    toast('Changes saved — export JSON when done auditing.');
  });

  const delBtn  = el('button', 'btn danger');
  delBtn.type   = 'button';
  delBtn.textContent = 'Delete recipe';
  delBtn.addEventListener('click', () => {
    if (!confirm('Delete "' + recipe.name + '"?\nThis will take effect when you export JSON.')) return;
    recipe._deleted = true;
    row.classList.add('deleted');
    row.classList.remove('open');
    markChanged(row);
    toast('Marked for deletion.');
  });

  ap(acts, saveBtn, delBtn);
  editor.appendChild(acts);
  row.appendChild(editor);

  head.addEventListener('click', () => row.classList.toggle('open'));
  return row;
}

// ── filter + render ───────────────────────────────────────────────────────────
function applyFilters() {
  const q    = document.getElementById('search').value.toLowerCase().trim();
  const cat  = document.getElementById('cat-filter').value;
  const sort = document.getElementById('sort-by').value;

  const filtered = ALL.filter(r => {
    if (r._deleted) return false;
    if (cat && r.category !== cat) return false;
    if (q) {
      const inName = r.name.toLowerCase().includes(q);
      const inIng  = r.ingredients.some(i => i.name.toLowerCase().includes(q));
      if (!inName && !inIng) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    if (sort === 'name')     return a.name.localeCompare(b.name);
    if (sort === 'category') return (a.category || '').localeCompare(b.category || '');
    if (sort === 'sum')      return ingSum(a.ingredients) - ingSum(b.ingredients);
    if (sort === 'count')    return b.ingredients.length - a.ingredients.length;
    return 0;
  });

  const list = document.getElementById('list');
  clearChildren(list);

  document.getElementById('showing-count').textContent = filtered.length;
  document.getElementById('empty').style.display = filtered.length === 0 ? 'block' : 'none';

  filtered.forEach(r => list.appendChild(buildRow(r)));
}

document.getElementById('search').addEventListener('input', () => {
  clearTimeout(window._st);
  window._st = setTimeout(applyFilters, 200);
});
document.getElementById('cat-filter').addEventListener('change', applyFilters);
document.getElementById('sort-by').addEventListener('change', applyFilters);

// ── export ────────────────────────────────────────────────────────────────────
document.getElementById('export-btn').addEventListener('click', () => {
  if (!STORE) return;
  STORE.recipes = ALL.filter(r => !r._deleted);
  const json = JSON.stringify(STORE, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'formulator-data.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Exported — replace file in repo and push.');
});
</script>

</body>
</html>
